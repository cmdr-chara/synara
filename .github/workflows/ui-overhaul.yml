name: UI overhaul verification
on:
  push:
    branches: [astra/session-ui-overhaul]
permissions:
  contents: read
concurrency:
  group: ui-overhaul-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ui-overhaul'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1000
      - name: Publish integrity-checked UI checkpoint on the isolated branch
        id: publish
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import apply_source
          apply_source.BRANCH = 'refs/heads/astra/session-ui-overhaul'
          apply_source.main()
          PY
  linux:
    needs: source
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 1000
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Export offline formatting tools
        run: |
          mkdir -p /tmp/ui-tools
          cp "$HOME/.rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu/bin/rustfmt" /tmp/ui-tools/
          ldd /tmp/ui-tools/rustfmt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-formatting-tools
          path: /tmp/ui-tools/
          retention-days: 1
      - name: Native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil fonts-dejavu-core
      - name: Fetch pinned dependencies
        run: cargo +1.98.1 fetch --locked
      - name: Export GPUI API source for offline implementation
        run: |
          mkdir -p /tmp/ui-api
          find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name 'gpui-*' -exec cp -r '{}' /tmp/ui-api/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-gpui-api
          path: /tmp/ui-api/
          retention-days: 1
      - name: Workspace structure
        run: python3 scripts/audit_workspace.py
      - name: Formatting
        run: cargo +1.98.1 fmt --check
      - name: Compile
        if: always()
        run: cargo +1.98.1 check --locked --workspace
      - name: Lints
        if: always()
        run: cargo +1.98.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        if: always()
        run: cargo +1.98.1 test --locked --workspace
      - name: Build native application and fixture
        if: always()
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Native desktop interaction smoke
        if: always()
        timeout-minutes: 5
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-native-smoke
      - name: UI state and layout smoke
        if: always()
        timeout-minutes: 5
        run: |
          if test -f scripts/ui_smoke.py; then
            python3 scripts/ui_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-ui-smoke
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-native-screenshots
          path: |
            /tmp/synara-native-smoke/
            /tmp/synara-ui-smoke/
          retention-days: 7
          if-no-files-found: warn
      - name: Export exact checked source and runnable binaries
        if: always()
        run: |
          mkdir -p /tmp/ui-build
          git bundle create /tmp/ui-build/source.bundle HEAD
          git rev-parse HEAD > /tmp/ui-build/revision.txt
          for binary in synara-app synara-acp-fixture; do
            if test -f "target/debug/$binary"; then
              cp "target/debug/$binary" /tmp/ui-build/
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-build-inputs
          path: /tmp/ui-build/
          retention-days: 1
