          python3 -m py_compile scripts/native_model_draft_smoke.py scripts/native_controls_smoke.py
          python3 scripts/check_roadmap.py
      - name: Chat preference storage regressions
        run: cargo +1.98.1 test --locked -p synara-workspace storage::chat_preferences::tests
      - name: Draft ordering and model interaction regressions
        run: |
          cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::drafts::tests
          cargo +1.98.1 test --locked -p synara-app --bin synara-app ui::menu
          cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::controls::tests
      - name: Build native application and fixture
        id: build
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Native model and durable draft journeys
        timeout-minutes: 4
        run: python3 scripts/native_model_draft_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-model-drafts
      - name: Native session control regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_controls_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-controls
      - name: Native chat creation and Studio regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_studio_settings_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-studio-drafts
      - name: Export checked source delta for plugin publication
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          paths=json.loads(Path('/tmp/synara-parity-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          unexpected=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert not unexpected,unexpected
          data=subprocess.check_output(['git','diff','--cached','--no-ext-diff','--no-renames','--binary'])
          assert b'GIT binary patch' not in data
          package={'base_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'mode':'diff','sha256':hashlib.sha256(data).hexdigest(),'gzip_base64':base64.b64encode(gzip.compress(data,mtime=0)).decode(),'message':'feat(ui): add provider tabs, saved model favorites and durable chat drafts'}
          Path('/tmp/ui-candidate').mkdir(exist_ok=True)
          Path('/tmp/ui-candidate/source.patch').write_bytes(data)
          Path('/tmp/ui-candidate/package.json').write_text(json.dumps(package))
          print('CHECKED_SOURCE_PACKAGE='+json.dumps(package,separators=(',',':')))
          print('CHECKED_BLOBS='+subprocess.check_output(['git','ls-files','-s','--',*paths],text=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: focused-native-presentation
          path: |
            /tmp/ui-*/*.png
            /tmp/ui-*/*.log
            /tmp/ui-*/result.json
            /tmp/ui-candidate/source.patch
            /tmp/ui-candidate/package.json
          retention-days: 7
          if-no-files-found: warn
