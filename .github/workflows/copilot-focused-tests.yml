name: Copilot Focused Tests

on:
  pull_request:
    branches:
      - main

jobs:
  web:
    if: github.head_ref == 'agent/copilot-cli-acp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run web tests with compact failure output
        shell: bash
        run: |
          set +e
          bun run --cwd apps/web test > /tmp/web-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '--- compact failure summary ---'
            grep -E 'FAIL |AssertionError|expected |❯ .*test|Failed Tests|Test Files|Tests ' /tmp/web-tests.log | tail -n 240 || true
            echo '--- end compact failure summary ---'
          fi
          exit "$status"
