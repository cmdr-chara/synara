name: SSH transport verification
on:
  push:
    branches: [astra/gpui-clean-rewrite, astra/session-ajm]
    paths:
      - crates/synara-runtime/**
      - crates/synara-app/**
      - crates/synara-acp/**
      - crates/synara-agent/**
      - crates/synara-core/**
      - crates/synara-workspace/**
      - Cargo.lock
      - Cargo.toml
      - ROADMAP.md
      - rust-toolchain.toml
      - scripts/ssh_smoke.py
      - .github/workflows/ssh.yml
permissions:
  contents: read
concurrency:
  group: ssh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-ajm:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ajm' && contains(github.event.head_commit.message, '[ajm-apply]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.apply.outputs.candidate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1000
          persist-credentials: false
      - name: Apply an exact, scope-limited source checkpoint
        id: apply
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, zlib
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          envelope = pathlib.Path('crates/synara-runtime/verification/ajm-checkpoint.json')
          assert envelope.stat().st_size <= 2_000_000
          data = json.loads(envelope.read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', data['base'])
          subprocess.run(['git', 'merge-base', '--is-ancestor', data['base'], 'HEAD'], check=True)
          assert git('merge-base', '1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121', 'HEAD') == '1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121'
          assert git('rev-list', '--max-parents=0', 'HEAD') == '43b1fb89bf19dadc388d18008f9ceb21b8215716'
          inflater = zlib.decompressobj()
          patch = inflater.decompress(base64.b64decode(data['patch'], validate=True), 4_000_001)
          assert len(patch) <= 4_000_000 and inflater.eof and not inflater.unused_data and not inflater.unconsumed_tail
          assert hashlib.sha256(patch).hexdigest() == data['sha256']
          exact = {'Cargo.lock', 'Cargo.toml', 'ROADMAP.md', 'crates/synara-app/src/shell.rs', 'crates/synara-app/src/shell/panels.rs'}
          prefixes = ('crates/synara-runtime/', 'crates/synara-workspace/', 'crates/synara-app/src/shell/terminal/')
          paths = set(data['files'])
          assert paths and len(paths) <= 80 and str(envelope) not in paths
          for name, hashes in data['files'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert all(ord(c) >= 32 for c in name)
              assert name in exact or name.startswith(prefixes) or name == 'crates/synara-app/src/shell/terminal.rs'
              entry = git('ls-tree', 'HEAD', '--', name).split()
              current = entry[2] if entry else None
              assert current == hashes['before'], f'changed base: {name}'
              assert hashes['after'] is None or re.fullmatch(r'[0-9a-f]{40}', hashes['after'])
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          changed = set(git('diff', '--cached', '--name-only').splitlines())
          assert changed == paths, (changed, paths)
          for name, hashes in data['files'].items():
              entry = git('ls-files', '--stage', '--', name).split()
              assert (entry[1] if entry else None) == hashes['after'], f'changed content: {name}'
              assert not entry or entry[0] == '100644', f'non-regular source: {name}'
          message = data['message']
          assert isinstance(message, str) and 1 <= len(message) <= 200 and '\n' not in message
          subprocess.run(['git', 'rm', '--', str(envelope)], check=True)
          subprocess.run(['git', '-c', 'user.name=Synara AJM checkpoint', '-c', 'user.email=synara-ajm@users.noreply.github.com', 'commit', '-m', message], check=True)
          candidate = git('rev-parse', 'HEAD')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'candidate={candidate}\n')
          print(f'Exact source candidate: {candidate}')
          PY
      - name: Publish only a fast-forward of the isolated session branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          test "$(git ls-remote origin refs/heads/astra/session-ajm | cut -f1)" = "$GITHUB_SHA"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/astra/session-ajm
          unset auth GH_TOKEN
  loopback:
    needs: [publish-ajm]
    if: always() && !cancelled() && (needs.publish-ajm.result == 'success' || needs.publish-ajm.result == 'skipped') && github.repository == 'cmdr-chara/synara' && (github.ref == 'refs/heads/astra/gpui-clean-rewrite' || github.ref == 'refs/heads/astra/session-ajm')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.publish-ajm.outputs.candidate || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust and OpenSSH
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Check fixture syntax
        run: python3 -m py_compile scripts/ssh_smoke.py
      - name: Verify isolated SSH transport and generic ACP
        run: |
          set -o pipefail
          { git rev-parse HEAD; python3 scripts/ssh_smoke.py; } 2>&1 | tee /tmp/ajm-ssh.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ajm-ssh-evidence
          path: /tmp/ajm-ssh.log
          retention-days: 7
  ajm-linux:
    needs: [publish-ajm]
    if: always() && !cancelled() && (needs.publish-ajm.result == 'success' || needs.publish-ajm.result == 'skipped') && github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ajm'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.publish-ajm.outputs.candidate || github.sha }}
          fetch-depth: 1000
          persist-credentials: false
      - name: Verify isolated lineage and preserve candidate
        run: |
          test "$(git merge-base 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121 HEAD)" = 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121
          test "$(git rev-list --max-parents=0 HEAD)" = 43b1fb89bf19dadc388d18008f9ceb21b8215716
          mkdir -p /tmp/ajm-evidence
          git rev-parse HEAD > /tmp/ajm-evidence/revision.txt
          git bundle create /tmp/ajm-evidence/source.bundle HEAD
      - name: Install pinned Rust and native libraries
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil fonts-dejavu-core
      - name: Export public native development inputs
        if: contains(github.event.head_commit.message, '[ajm-native-kit]')
        run: |
          python3 - <<'PY'
          import glob, pathlib, re, shutil, subprocess, tarfile
          root = pathlib.Path('/tmp/ajm-native-kit')
          library = root / 'usr/lib/x86_64-linux-gnu'
          library.mkdir(parents=True)
          shutil.copytree('/usr/include', root / 'usr/include', symlinks=True)
          shutil.copytree('/usr/lib/x86_64-linux-gnu/pkgconfig', library / 'pkgconfig', symlinks=True)
          shutil.copytree('/usr/share/pkgconfig', root / 'usr/share/pkgconfig', symlinks=True)
          seen = {}
          def add(source):
              p = pathlib.Path(source)
              real = p.resolve(strict=True)
              dest = library / p.name
              if dest.exists() or dest.is_symlink():
                  return
              if real in seen:
                  dest.symlink_to(seen[real])
              else:
                  shutil.copy2(real, dest)
                  seen[real] = dest.name
          names = 'fontconfig freetype expat png16 z bz2 brotli* harfbuzz graphite2 asound xcb* X11 X11-xcb Xau Xdmcp Xrandr Xrender Xext Xfixes Xcursor Xinerama xkbcommon* wayland* ffi EGL GL* vulkan ssl crypto zstd xml2 edit tinfo bsd md drm*'
          for name in names.split():
              for source in glob.glob('/usr/lib/x86_64-linux-gnu/lib' + name + '.so*'):
                  add(source)
          clang = pathlib.Path('/usr/lib/llvm-18/lib/libclang.so')
          add(clang)
          for line in subprocess.check_output(['ldd', str(clang)], text=True).splitlines():
              match = re.search(r'=> (/\S+)', line)
              if match and pathlib.Path(match.group(1)).name not in {'libc.so.6','libm.so.6','libdl.so.2','libpthread.so.0','libstdc++.so.6','libgcc_s.so.1'}:
                  add(match.group(1))
          with tarfile.open('/tmp/ajm-native-kit.tar.gz', 'w:gz') as tar:
              tar.add(root / 'usr', arcname='usr')
          assert pathlib.Path('/tmp/ajm-native-kit.tar.gz').stat().st_size < 500_000_000
          PY
          sha256sum /tmp/ajm-native-kit.tar.gz > /tmp/ajm-native-kit.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: contains(github.event.head_commit.message, '[ajm-native-kit]')
        with:
          name: ajm-native-development-inputs
          path: |
            /tmp/ajm-native-kit.tar.gz
            /tmp/ajm-native-kit.sha256
          retention-days: 1
          compression-level: 0
      - name: Structural checks
        run: |
          set -o pipefail
          { python3 scripts/audit_workspace.py && python3 scripts/test_apply_source.py && python3 scripts/check_roadmap.py --self-test && python3 scripts/check_roadmap.py; } 2>&1 | tee /tmp/ajm-evidence/structure.log
      - name: Formatting
        if: always()
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee /tmp/ajm-evidence/fmt.log
      - name: Compile workspace
        if: always()
        run: |
          set -o pipefail
          cargo check --locked --workspace 2>&1 | tee /tmp/ajm-evidence/check.log
      - name: Lint all targets and features
        if: always()
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/ajm-evidence/clippy.log
      - name: Workspace regression tests
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee /tmp/ajm-evidence/test.log
      - name: Build native smoke binaries
        run: |
          set -o pipefail
          cargo build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture 2>&1 | tee /tmp/ajm-evidence/build.log
      - name: Isolated native desktop smoke
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-ajm-smoke 2>&1 | tee /tmp/ajm-evidence/smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ajm-linux-evidence
          path: |
            /tmp/ajm-evidence/
            /tmp/synara-ajm-smoke/*.png
            /tmp/synara-ajm-smoke/*.log
            /tmp/synara-ajm-smoke/result.json
          retention-days: 7
          if-no-files-found: warn
