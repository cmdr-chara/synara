name: Source checkpoint
on:
  push:
    branches: [astra/gpui-clean-rewrite]
    paths: [.github/workflows/source-checkpoint.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 200
          persist-credentials: false
      - name: Export exact source without running tests
        run: |
          mkdir -p /tmp/source-checkpoint
          git rev-parse HEAD > /tmp/source-checkpoint/revision.txt
          git bundle create /tmp/source-checkpoint/source.bundle HEAD
          git archive --format=tar.gz --output=/tmp/source-checkpoint/source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-checkpoint
          path: /tmp/source-checkpoint/
          retention-days: 7
