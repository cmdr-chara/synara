name: Feature closure sprint
on:
  push:
    branches: [astra/feature-closure-sprint]
    paths: [.feature-closure-request.json, .github/workflows/feature-closure-sprint.yml, scripts/feature_closure_transfer.py]
permissions:
  contents: read
concurrency:
  group: feature-closure-sprint
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      publication_sha256: ${{ steps.package.outputs.publication_sha256 }}
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: feature-closure-1.98.1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            feature-closure-1.98.1-${{ runner.os }}-
      - name: Prepare hash-checked final source and diagnosed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, sys
          sys.path.insert(0, 'scripts')
          import feature_closure_transfer as transfer
          original = transfer.read_request
          def request():
              value = original()
              assert value['patch_gzip_base64'] == ['.feature-closure-part-0000']
              path = Path('.feature-closure-part-0000')
              assert not path.is_symlink() and 0 < path.stat().st_size < 65536
              encoded = path.read_text()
              blob = hashlib.sha1(('blob ' + str(len(encoded.encode())) + '\0').encode() + encoded.encode()).hexdigest()
              if blob == '80054c3bae6506655bdbc9dc9c682a58e38bb82c':
                  assert encoded.count('tLppYRRreRGf') == 1
                  encoded = encoded.replace('tLppYRRreRGf', 'tLppYRreRGf')
              assert hashlib.sha256(encoded.encode()).hexdigest() == '8593d827adbd67f8b4de3323563114f4389bd8c5625569b12d8d13c4d82242fc'
              value['patch_gzip_base64'] = encoded
              return value
          transfer.read_request = request
          transfer.prepare()
          for name, digest in [
              ('.feature-closure-part-0013','14cea6982679670ee6c0cdef8fde1cca0de5b6c215e03302009bc7d02652236e'),
              ('.feature-closure-part-0014','12013150a3d90e2bb962c7c9c580051f3a4c224bdfe780ab988e5ce894e62587')
          ]:
              repair = Path(name)
              assert not repair.is_symlink() and 0 < repair.stat().st_size < 16384
              assert hashlib.sha256(repair.read_bytes()).hexdigest() == digest
              subprocess.run(['git','apply','--index','--check','--whitespace=error-all',name],check=True)
              subprocess.run(['git','apply','--index','--whitespace=error-all',name],check=True)
          (transfer.EVIDENCE / 'source-paths.json').write_text(json.dumps(transfer.changed_paths()))
          PY
      - name: Full accumulated Rust, native and static validation
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import feature_closure_transfer as transfer
          original = transfer.logged
          failures = []
          def logged(name, args, allowed_errors=None):
              try:
                  original(name,args,allowed_errors)
              except subprocess.CalledProcessError:
                  if name.startswith('native-') and name != 'native-build.log':
                      failures.append(name)
                  else:
                      raise
          transfer.logged = logged
          transfer.check()
          original('app-tests.log',['cargo','+1.98.1','test','--locked','-p','synara-app'])
          for name in ['test_audit_workspace','test_native_ui_scope','test_ci_router','test_apply_source']:
              original(name+'.log',['python3','scripts/'+name+'.py'])
          original('roadmap-self-test.log',['python3','scripts/check_roadmap.py','--self-test'])
          base = subprocess.check_output(['git','show','fe515833c565d666204f24e5257d85025dede0e9:ROADMAP.md']).decode()
          current = Path('ROADMAP.md').read_text()
          pattern = r'^- \[[ x]\] [A-Q]\d+ [^\n]*(?:\n(?:  [^\n]*|\t[^\n]*))*'
          old = re.findall(pattern,base,re.M)
          assert len(old)==120 and old==re.findall(pattern,current,re.M)
          (transfer.EVIDENCE/'historical-task-integrity.txt').write_text('PASS: 120 original A-Q task bodies and checkbox states unchanged\n')
          (transfer.EVIDENCE/'native-failures.json').write_text(json.dumps(failures))
          assert not failures, failures
          PY
      - name: Package exactly the checked tree
        id: package
        run: python3 scripts/feature_closure_transfer.py package
      - name: Preserve exact history and all results, including failures
        if: always()
        run: |
          mkdir -p /tmp/feature-closure-evidence
          git rev-parse HEAD > /tmp/feature-closure-evidence/worktree-revision.txt
          git status --short > /tmp/feature-closure-evidence/status.txt
          git diff HEAD > /tmp/feature-closure-evidence/candidate.patch
          git bundle create /tmp/feature-closure-evidence/history.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-closure-evidence
          path: /tmp/feature-closure-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: feature-closure-publication
          path: /tmp/feature-closure-publication/
          retention-days: 1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: feature-closure-1.98.1-${{ runner.os }}-${{ github.sha }}
  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feature-closure-publication
          path: /tmp/feature-closure-publication/
      - name: Publish verified Git objects and non-force session ref only
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA256: ${{ needs.check.outputs.publication_sha256 }}
        run: python3 scripts/feature_closure_transfer.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-closure-published-ref
          path: /tmp/feature-closure-evidence/
          retention-days: 7
