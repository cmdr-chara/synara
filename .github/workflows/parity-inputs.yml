name: Electron parity development inputs
on:
  push:
    branches: [astra/gpui-clean-rewrite]
    paths: ['.github/workflows/parity-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REFERENCE_REVISION: eaa61eded31b6755d4f30ba8eabc5d905cf817cb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: native
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Emanuele-web04/synara
          ref: eaa61eded31b6755d4f30ba8eabc5d905cf817cb
          path: reference
          persist-credentials: false
      - name: Preserve immutable reference source without executing it
        run: |
          mkdir -p "$RUNNER_TEMP/parity-reference"
          test "$(git -C reference rev-parse HEAD)" = "$REFERENCE_REVISION"
          git -C reference archive HEAD | gzip -n > "$RUNNER_TEMP/parity-reference/electron-source.tar.gz"
          git -C reference rev-parse HEAD > "$RUNNER_TEMP/parity-reference/electron-revision.txt"
          git -C native rev-parse HEAD > "$RUNNER_TEMP/parity-reference/native-revision.txt"
          sha256sum "$RUNNER_TEMP/parity-reference/electron-source.tar.gz" > "$RUNNER_TEMP/parity-reference/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-parity-reference
          path: ${{ runner.temp }}/parity-reference/
          retention-days: 7
          compression-level: 0
      - name: Pinned native development prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev mesa-vulkan-drivers libxtst6
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: parity-inputs-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            native-conversation-${{ runner.os }}-
            feature-closure-2-1.98.1-${{ runner.os }}-
      - name: Export pinned compiler and locked dependency sources
        working-directory: native
        run: |
          mkdir -p "$RUNNER_TEMP/parity-toolchain"
          cargo +1.98.1 vendor --locked --versioned-dirs "$RUNNER_TEMP/parity-vendor" > "$RUNNER_TEMP/parity-toolchain/vendor-config.toml"
          tar -C "$RUNNER_TEMP/parity-vendor" -czf "$RUNNER_TEMP/parity-toolchain/vendor.tar.gz" .
          tar -C "$(rustc +1.98.1 --print sysroot)" -cJf "$RUNNER_TEMP/parity-toolchain/rust-1.98.1.tar.xz" .
          cp Cargo.lock "$RUNNER_TEMP/parity-toolchain/Cargo.lock"
          git diff --exit-code
          cd "$RUNNER_TEMP/parity-toolchain"
          sha256sum vendor.tar.gz rust-1.98.1.tar.xz Cargo.lock > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-parity-rust-inputs
          path: ${{ runner.temp }}/parity-toolchain/
          retention-days: 3
          compression-level: 0
      - name: Export public Linux headers and dependency libraries only
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, pathlib, re, subprocess, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'parity-sysroot'
          root.mkdir()
          paths = {'/usr/include', '/usr/lib/x86_64-linux-gnu/pkgconfig', '/usr/share/pkgconfig'}
          stems = ['asound', 'xcb', 'X', 'xkbcommon', 'wayland', 'vulkan', 'EGL', 'GL', 'fontconfig', 'freetype', 'ssl', 'crypto', 'zstd', 'gtk', 'gdk', 'glib', 'gobject', 'gio', 'gmodule', 'gthread', 'pango', 'cairo', 'atk', 'webkit', 'javascriptcore', 'harfbuzz', 'ffi', 'png', 'expat', 'z', 'bz2', 'brotli', 'uuid', 'drm', 'gbm', 'udev', 'dbus']
          libraries = set()
          for stem in stems:
              libraries.update(glob.glob('/usr/lib/x86_64-linux-gnu/lib' + stem + '*.so*'))
          libraries.update(glob.glob('/usr/lib/llvm-*/lib/libclang.so*'))
          for path in tuple(libraries):
              result = subprocess.run(['ldd', path], capture_output=True, text=True, check=False)
              for dependency in re.findall(r'=> (/[^\s]+)', result.stdout):
                  name = pathlib.Path(dependency).name
                  if not re.match(r'lib(c|m|pthread|dl|rt|resolv)\.so', name):
                      libraries.add(str(pathlib.Path(dependency).resolve()))
          paths.update(path for path in libraries if pathlib.Path(path).exists())
          paths.update(glob.glob('/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1'))
          archive_path = root / 'native-sysroot.tar.gz'
          with tarfile.open(archive_path, 'w:gz', dereference=True) as archive:
              for name in sorted(paths):
                  if pathlib.Path(name).exists():
                      archive.add(name, arcname=name.lstrip('/'))
          (root / 'SHA256SUMS').write_text(hashlib.file_digest(archive_path.open('rb'), 'sha256').hexdigest() + '  native-sysroot.tar.gz\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-parity-native-inputs
          path: ${{ runner.temp }}/parity-sysroot/
          retention-days: 3
          compression-level: 0
