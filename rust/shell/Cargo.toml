[package]
name = "synara-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Synara desktop shell: gpui-kit (gpui-fast) window embedding the web UI via a native webview while the UI is rebuilt natively"
license = "MIT"

[dependencies]
core-foundation-sys = "0.8"
gpui-kit = { version = "0.11", features = ["gpui-fast", "tree-sitter", "tree-sitter-languages"] }
gpui-webview = { version = "0.11", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tungstenite = "0.26"
ureq = { version = "2", features = ["json"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
urlencoding = "2"
cpal = "0.15"
base64 = "0.22"
smallvec = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
browserhost-rs = { path = "../browserhost-rs" }
tokio = { version = "1", features = ["rt-multi-thread"] }
libc = "0.2"
signal-hook = "0.3"
synara-shellenv = { path = "../shellenv" }
betadiagnostics-rs = { path = "../betadiagnostics-rs" }
hostusagerelay-rs = { path = "../hostusagerelay-rs" }
productanalytics-rs = { path = "../productanalytics-rs" }
url = "2"

[workspace]

[profile.dev]
debug = 1
incremental = false
