name: Maximum sprint final metadata
on:
  push:
    branches: [astra/max-feature-sprint]
    paths: [.synara-max-feature.json]
permissions:
  contents: write
concurrency:
  group: max-feature-sprint
  cancel-in-progress: false
jobs:
  verify-and-retire:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify accepted source identity, metadata and cleanup
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/max-feature-evidence
          python3 scripts/apply_max_feature_source.py 2>&1 | tee /tmp/max-feature-evidence/validation.log
      - name: Preserve exact final state and full history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/max-feature-evidence
          git rev-parse HEAD > /tmp/max-feature-evidence/revision.txt
          git rev-parse HEAD^{tree} > /tmp/max-feature-evidence/tree.txt
          git status --short > /tmp/max-feature-evidence/status.txt
          git diff HEAD > /tmp/max-feature-evidence/candidate.patch
          git ls-remote origin refs/heads/main refs/heads/astra/gpui-clean-rewrite refs/heads/astra/max-feature-sprint > /tmp/max-feature-evidence/refs.txt
          git bundle create /tmp/max-feature-evidence/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-feature-final-metadata
          path: /tmp/max-feature-evidence/
          retention-days: 7
