name: One-time Rust formatting
on:
  push:
    branches: [main]
    paths: ['.github/workflows/format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 0
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo +1.98.1 fmt --all
      - name: Commit formatter output
        run: |
          set -euo pipefail
          if git diff --quiet -- crates; then
            exit 0
          fi
          git config user.name "Commander Chara"
          git config user.email "249489759+cmdr-chara@users.noreply.github.com"
          git add -- crates
          git commit -m "style: apply rustfmt to Rust parity changes"
          git push origin HEAD:main
