          //! Provider tabs and stars decorate immutable controller action indices.
          use super::*;
          use synara_workspace::{ModelFavorite, WorkspaceService};
          use tokio::runtime::Handle;
          pub struct ModelSource { pub name: String, pub icon: Glyph }
          pub struct ModelRow { pub source: usize, pub favorite: Option<ModelFavorite> }
          pub(super) struct ModelState {
              sources: Vec<ModelSource>, rows: Vec<ModelRow>, tab: Option<usize>,
              favorites: Vec<ModelFavorite>, ready: bool, saving: bool, error: Option<String>,
              workspace: WorkspaceService, runtime: Handle,
          }
          impl ModelState {
              pub(super) fn includes(&self, index: usize) -> bool {
                  self.rows.get(index).is_some_and(|row| match self.tab {
                      Some(source) => row.source == source,
                      None => row.favorite.as_ref().is_some_and(|f| self.favorites.contains(f)),
                  })
              }
          }
          impl ChoiceMenu {
              pub fn with_models(mut self, sources: Vec<ModelSource>, rows: Vec<ModelRow>, current: usize, workspace: WorkspaceService, runtime: Handle, cx: &mut Context<Self>) -> Self {
                  debug_assert_eq!(rows.len(), self.choices.len());
                  self.search = cx.new(|cx| TextEntry::new("Search models...",EntryMode::SingleLine,32.,cx).with_leading_icon(Glyph::Search).picker_chrome());
                  self._search_events = cx.subscribe(&self.search, |this,entry,event,cx| {
                      if matches!(event,EntryEvent::Changed) { this.filter(entry.read(cx).text().to_owned(),cx); }
                  });
                  self.searchable = true;
                  self.models = Some(ModelState { sources,rows,tab:Some(current),favorites:vec![],ready:false,saving:false,error:None,workspace:workspace.clone(),runtime:runtime.clone() });
                  self.filter(String::new(),cx);
                  let job=runtime.spawn(async move { workspace.model_favorites().await });
                  cx.spawn(async move |view,cx| {
                      let result=job.await;
                      let _=view.update(cx,|this,cx| {
                          if let Some(state)=&mut this.models {
                              match result { Ok(Ok(favorites)) => {state.favorites=favorites; state.ready=true;}, _ => state.error=Some("Could not load favorites. Reopen the picker to retry.".into()) }
                          }
                          this.filter(this.query.clone(),cx);
                      });
                  }).detach();
                  self
              }
              pub(super) fn model_title(&self) -> String {
                  self.models.as_ref().map_or_else(||self.title.clone(),|state| state.tab.and_then(|i|state.sources.get(i)).map_or_else(||"Starred models".into(),|s|s.name.clone()))
              }
              fn choose_source(&mut self, tab: Option<usize>, window: &mut Window, cx: &mut Context<Self>) {
                  let Some(state)=&mut self.models else {return;};
                  if tab.is_some_and(|i| i>=state.sources.len()) {return;}
                  state.tab=tab;
                  self.search.update(cx,|e,cx|e.set_text(String::new(),cx));
                  self.filter(String::new(),cx);
                  window.focus(&self.search.read(cx).focus_handle(cx),cx);
              }
              pub(super) fn model_source_key(&mut self,event:&KeyDownEvent,window:&mut Window,cx:&mut Context<Self>) -> bool {
                  let Some(state)=&self.models else {return false;};
                  let m=event.keystroke.modifiers;
                  if !m.alt || m.control || m.platform || !matches!(event.keystroke.key.as_str(),"left"|"right") {return false;}
                  let count=state.sources.len()+1;
                  let index=state.tab.map_or(0,|i|i+1);
                  let next=if event.keystroke.key=="left" {(index+count-1)%count} else {(index+1)%count};
                  self.choose_source(next.checked_sub(1),window,cx); cx.stop_propagation(); true
              }
