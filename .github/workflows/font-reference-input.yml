name: Locked font reference input
on:
  push:
    branches: [astra/electron-main-parity]
    paths: [.github/workflows/font-reference-input.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Preserve the exact public font inputs without executing scripts
        run: |
          mkdir -p /tmp/locked-font
          python3 - <<'PY'
          import base64, hashlib, pathlib, urllib.request
          root = pathlib.Path('/tmp/locked-font')
          expected = 'WBA9elru6Jdp5df2mES55wuOO0WIrn3kpXnI4+W2ek5u3ZgLS9XS4gmIlcQhiZOWEKl95meYdvK7xI+ETLCq/Q=='
          url = 'https://registry.npmjs.org/@fontsource-variable/jetbrains-mono/-/jetbrains-mono-5.2.8.tgz'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(8 * 1024 * 1024 + 1)
          assert len(data) <= 8 * 1024 * 1024
          assert hashlib.sha512(data).digest() == base64.b64decode(expected)
          (root / 'jetbrains-mono-5.2.8.tgz').write_bytes(data)
          files = {
              'JetBrainsMono-Variable.ttf': ('JetBrainsMono%5Bwght%5D.ttf', 'aa310be8b717fe3774f9444dd89d5f4101cc6d10'),
              'JetBrainsMono-Italic-Variable.ttf': ('JetBrainsMono-Italic%5Bwght%5D.ttf', '5210f7350c95eef62d53de85b5953f4d5ff022ec'),
              'JetBrainsMono-OFL.txt': ('OFL.txt', '821a3dac22aff15a1f1c9689a1d79c45bb58ca39'),
          }
          for name, (path, sha) in files.items():
              with urllib.request.urlopen('https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/' + path, timeout=30) as response:
                  data = response.read(1024 * 1024 + 1)
              assert len(data) <= 1024 * 1024
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
              (root / name).write_bytes(data)
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in sorted(root.iterdir())))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: locked-font-reference-input
          path: /tmp/locked-font/
          retention-days: 3
