name: PAB current source export
on:
  push:
    branches: [astra/pr-automations-browser]
    paths: [.github/workflows/pab-export-current.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact branch source without builds or writes
        run: |
          set -euo pipefail
          mkdir -p /tmp/pab-current
          git rev-parse HEAD > /tmp/pab-current/revision.txt
          git bundle create /tmp/pab-current/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pab-current-source
          path: /tmp/pab-current/
          retention-days: 1
