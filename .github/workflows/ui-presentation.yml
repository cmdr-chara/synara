name: Focused native presentation
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare bounded parity candidate without publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          changed = set()
          def edit(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == count, (path, old[:100], s.count(old), count)
              p.write_text(s.replace(old, new), encoding='utf-8')
              changed.add(path)
          def add(path, text):
              p = Path(path)
              assert not p.exists(), path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text.lstrip('\n'), encoding='utf-8')
              changed.add(path)
          storage = 'crates/synara-workspace/src/storage.rs'
          edit(storage, 'mod recovery;', 'mod chat_preferences;\npub use chat_preferences::ModelFavorite;\nmod recovery;')
          edit(storage, 'fn valid_preference_key(key: &str) -> bool {', '''fn valid_preference_key(key: &str) -> bool {
              if key == "model-favorites" { return true; }
              if let Some(id) = key.strip_prefix("task-draft:") {
                  return id.len() == 36 && serde_json::from_value::<TaskId>(serde_json::Value::String(id.into())).is_ok();
              }''')
          edit(storage, '        let changed = tx.execute("DELETE FROM tasks WHERE id=?1", [id.to_string()])?;', '''        tx.execute("DELETE FROM preferences WHERE key=?1", [format!("task-draft:{id}")])?;
                  let changed = tx.execute("DELETE FROM tasks WHERE id=?1", [id.to_string()])?;''')
          add('crates/synara-workspace/src/storage/chat_preferences.rs', r'''
          //! User-owned chat preferences. Reads never start agents or alter events.
          use super::*;
          use crate::{WorkspaceError, WorkspaceResult, WorkspaceService};
          use serde::{Deserialize, Serialize};
          const MAX_DRAFT: usize = 1024 * 1024;
          const MAX_FAVORITES: usize = 256;
          #[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          pub struct ModelFavorite {
              pub agent: String,
              /// None denotes the legacy model selector, not a config option.
              pub option: Option<String>,
              pub value: String,
          }
          impl ModelFavorite {
              fn valid(&self) -> bool {
                  fn text(s: &str) -> bool { !s.is_empty() && s.len() <= 1024 && !s.chars().any(char::is_control) }
                  text(&self.agent) && self.agent.len() <= 128 && text(&self.value)
                      && self.option.as_deref().is_none_or(text)
              }
          }
          #[derive(Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct Favorites { version: u32, entries: Vec<ModelFavorite> }
          impl Default for Favorites {
              fn default() -> Self { Self { version: 1, entries: vec![] } }
          }
          impl Favorites {
              fn validate(&self) -> StorageResult<()> {
                  if self.version != 1 || self.entries.len() > MAX_FAVORITES || self.entries.iter().any(|e| !e.valid())
                      || self.entries.iter().enumerate().any(|(i, e)| self.entries[..i].contains(e)) {
                      return Err(StorageError::Identity);
                  }
                  Ok(())
              }
          }
          #[derive(Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct Draft { version: u32, text: String }
          impl Store {
              fn model_favorites(&self) -> StorageResult<Vec<ModelFavorite>> {
                  let stored = self.preference::<Favorites>("model-favorites")?.unwrap_or_default();
                  stored.validate()?;
                  Ok(stored.entries)
              }
              fn set_model_favorite(&mut self, value: ModelFavorite, enabled: bool) -> StorageResult<Vec<ModelFavorite>> {
                  if !value.valid() { return Err(StorageError::Identity); }
                  // Read/modify/write is one SQLite transaction, including across separate openers.
                  let tx = self.connection.transaction_with_behavior(TransactionBehavior::Immediate)?;
                  let raw: Option<String> = tx.query_row("SELECT data FROM preferences WHERE key='model-favorites'", [], |r| r.get(0)).optional()?;
                  let mut stored = raw.as_deref().map(decode::<Favorites>).transpose()?.unwrap_or_default();
                  stored.validate()?;
                  if enabled && !stored.entries.contains(&value) { stored.entries.push(value); }
                  else if !enabled { stored.entries.retain(|e| e != &value); }
                  stored.validate()?;
                  tx.execute("INSERT INTO preferences(key,data) VALUES('model-favorites',?1) ON CONFLICT(key) DO UPDATE SET data=excluded.data", [encode(&stored)?])?;
                  tx.commit()?;
                  Ok(stored.entries)
              }
              fn task_draft(&self, id: TaskId) -> StorageResult<Option<String>> {
                  if self.task(id)?.is_none() { return Ok(None); }
                  let draft = self.preference::<Draft>(&format!("task-draft:{id}"))?;
                  match draft {
                      Some(draft) if draft.version == 1 && draft.text.len() <= MAX_DRAFT => Ok(Some(draft.text)),
                      Some(_) => Err(StorageError::Limit),
                      None => Ok(Some(String::new())),
                  }
              }
              fn save_task_draft(&mut self, id: TaskId, text: String) -> StorageResult<bool> {
                  if text.len() > MAX_DRAFT { return Err(StorageError::Limit); }
                  let tx = self.connection.transaction_with_behavior(TransactionBehavior::Immediate)?;
                  let exists: bool = tx.query_row("SELECT EXISTS(SELECT 1 FROM tasks WHERE id=?1)", [id.to_string()], |r| r.get(0))?;
                  if !exists { return Ok(false); }
                  let data = encode(&Draft { version: 1, text })?;
                  tx.execute("INSERT INTO preferences(key,data) VALUES(?1,?2) ON CONFLICT(key) DO UPDATE SET data=excluded.data", params![format!("task-draft:{id}"), data])?;
                  tx.commit()?;
                  Ok(true)
              }
          }
          impl WorkspaceService {
              pub async fn model_favorites(&self) -> WorkspaceResult<Vec<ModelFavorite>> {
                  self.access(|store| Ok(store.model_favorites()?)).await
              }
              /// Sets an explicit state, rather than a retry-sensitive toggle.
              pub async fn set_model_favorite(&self, favorite: ModelFavorite, enabled: bool) -> WorkspaceResult<Vec<ModelFavorite>> {
                  self.access(move |store| Ok(store.set_model_favorite(favorite, enabled)?)).await
              }
              pub async fn task_draft(&self, id: TaskId) -> WorkspaceResult<String> {
                  self.access(move |store| store.task_draft(id)?.ok_or(WorkspaceError::NotFound)).await
              }
              pub async fn save_task_draft(&self, id: TaskId, text: String) -> WorkspaceResult<()> {
                  self.access(move |store| if store.save_task_draft(id, text)? { Ok(()) } else { Err(WorkspaceError::NotFound) }).await
              }
          }
          #[cfg(test)]
          mod tests {
              use super::*;
              fn favorite(agent: &str, value: &str) -> ModelFavorite { ModelFavorite { agent: agent.into(), option: Some("model".into()), value: value.into() } }
              #[tokio::test]
              async fn favorite_identity_is_provider_and_option_scoped_and_sets_are_idempotent() {
                  let s = WorkspaceService::memory().unwrap();
                  let a = favorite("alpha", "same");
                  let b = favorite("beta", "same");
                  s.set_model_favorite(a.clone(), true).await.unwrap();
                  assert_eq!(s.set_model_favorite(a.clone(), true).await.unwrap().len(), 1);
                  assert_eq!(s.set_model_favorite(b.clone(), true).await.unwrap().len(), 2);
                  let mut legacy = a.clone(); legacy.option = None;
                  assert_eq!(s.set_model_favorite(legacy, true).await.unwrap().len(), 3);
                  assert_eq!(s.set_model_favorite(a, false).await.unwrap().len(), 2);
                  assert!(s.model_favorites().await.unwrap().contains(&b));
              }
              #[tokio::test]
              async fn favorites_survive_reopen_and_unrelated_settings_saves() {
                  let dir = tempfile::tempdir().unwrap(); let path = dir.path().join("data.db");
                  let s = WorkspaceService::open(path.clone()).await.unwrap();
                  let stale_settings = s.settings().await.unwrap().settings;
                  let a = favorite("alpha", "a");
                  s.set_model_favorite(a.clone(), true).await.unwrap();
                  s.save_settings(stale_settings).await.unwrap(); drop(s);
                  assert_eq!(WorkspaceService::open(path).await.unwrap().model_favorites().await.unwrap(), vec![a]);
              }
              #[tokio::test]
              async fn concurrent_openers_do_not_lose_favorites() {
                  let dir = tempfile::tempdir().unwrap(); let path = dir.path().join("data.db");
                  let a = WorkspaceService::open(path.clone()).await.unwrap();
                  let b = WorkspaceService::open(path).await.unwrap();
                  let (x,y) = tokio::join!(a.set_model_favorite(favorite("a", "m"), true), b.set_model_favorite(favorite("b", "m"), true));
                  x.unwrap(); y.unwrap(); assert_eq!(a.model_favorites().await.unwrap().len(), 2);
              }
              #[tokio::test]
              async fn malformed_preferences_are_not_silently_replaced() {
                  let s = WorkspaceService::memory().unwrap();
                  s.access(|store| { store.set_preference("model-favorites", &serde_json::json!({"version":99,"entries":[]}))?; Ok(()) }).await.unwrap();
                  assert!(s.model_favorites().await.is_err());
                  assert!(s.set_model_favorite(favorite("a", "m"), true).await.is_err());
                  s.access(|store| { assert_eq!(store.preference::<serde_json::Value>("model-favorites")?.unwrap()["version"], 99); Ok(()) }).await.unwrap();
              }
              #[tokio::test]
              async fn favorites_are_bounded_and_hostile_values_preserve_last_good_state() {
                  let s = WorkspaceService::memory().unwrap();
                  s.set_model_favorite(favorite("a", "m"), true).await.unwrap();
                  for value in ["".to_owned(), "x\ny".into(), "x".repeat(1025)] { assert!(s.set_model_favorite(favorite("a", &value), true).await.is_err()); }
                  assert_eq!(s.model_favorites().await.unwrap().len(), 1);
                  let stored = Favorites { version: 1, entries: (0..257).map(|i| favorite("a", &i.to_string())).collect() };
                  assert!(stored.validate().is_err());
              }
              #[tokio::test]
              async fn drafts_restore_unicode_without_events_sessions_or_autostart() {
                  let dir = tempfile::tempdir().unwrap(); let path = dir.path().join("data.db");
                  let s = WorkspaceService::open(path.clone()).await.unwrap();
                  let p = s.add_local_workspace(dir.path().into()).await.unwrap();
                  let agent = s.profiles().await.unwrap()[0].id.clone();
                  let task = s.create_task(p.id, "Draft".into(), agent).await.unwrap();
                  let text = "Caffè 日本語\nUnsent @src/main.rs";
                  s.save_task_draft(task.id, text.into()).await.unwrap(); drop(s);
                  let s = WorkspaceService::open(path).await.unwrap();
                  assert_eq!(s.task_draft(task.id).await.unwrap(), text);
                  assert!(s.thread(task.thread_id).await.unwrap().messages.is_empty());
                  assert!(s.session(task.thread_id).await.unwrap().is_none());
                  assert_eq!(s.task(task.id).await.unwrap().state, TaskState::Ready);
              }
              #[tokio::test]
              async fn oversized_or_deleted_task_drafts_cannot_leave_orphan_preferences() {
                  let dir = tempfile::tempdir().unwrap(); let s = WorkspaceService::memory().unwrap();
                  let p = s.add_local_workspace(dir.path().into()).await.unwrap();
                  let agent = s.profiles().await.unwrap()[0].id.clone();
                  let task = s.create_task(p.id, "Draft".into(), agent).await.unwrap();
                  s.save_task_draft(task.id, "keep".into()).await.unwrap();
                  assert!(s.save_task_draft(task.id, "x".repeat(MAX_DRAFT+1)).await.is_err());
                  assert_eq!(s.task_draft(task.id).await.unwrap(), "keep");
                  s.archive_task(task.id).await.unwrap(); s.delete_task(task.id).await.unwrap();
                  assert!(s.save_task_draft(task.id, "orphan".into()).await.is_err());
                  s.access(move |store| { assert!(store.preference::<Draft>(&format!("task-draft:{}",task.id))?.is_none()); Ok(()) }).await.unwrap();
              }
              #[test]
              fn draft_keys_reject_paths_and_invalid_ids() {
                  for key in ["task-draft:", "task-draft:../settings", "task-draft:not-a-uuid"] { assert!(!valid_preference_key(key)); }
                  assert!(valid_preference_key(&format!("task-draft:{}", TaskId::new())));
              }
          }
          ''')
          shell = 'crates/synara-app/src/shell.rs'
          edit(shell, 'mod dock;', 'mod dock;\nmod drafts;')
          edit(shell, 'enum Update {', 'enum Update {\n    DraftLoaded(TaskId, Result<String, String>),\n    DraftSaved(TaskId, Option<String>),')
          edit(shell, '    drafts: HashMap<TaskId, String>,', '    drafts: HashMap<TaskId, String>,\n    draft_state: drafts::DraftState,')
          edit(shell, '            drafts: HashMap::new(),', '            drafts: HashMap::new(),\n            draft_state: drafts::DraftState::default(),')
          edit(shell, '                EntryEvent::Submit => this.send_prompt(cx),\n                _ => cx.notify(),', '                EntryEvent::Submit => this.send_prompt(cx),\n                EntryEvent::Changed => this.remember_draft(cx),\n                _ => cx.notify(),')
          edit(shell, '    fn begin_quit(&mut self, cx: &mut Context<Self>) {\n        if self.terminal_closing {\n            return;\n        }', '    fn begin_quit(&mut self, cx: &mut Context<Self>) {\n        if self.terminal_closing {\n            return;\n        }\n        if self.save_drafts_before_quit(cx) { return; }')
          edit(shell, '''        if let Some(previous) = self.selected {
                      self.drafts
                          .insert(previous, self.composer.read(cx).text().to_owned());
                  }''', '        self.snapshot_draft(cx);')
          edit(shell, '        self.transcript = transcript::TranscriptState::new();\n        self.focus_composer = true;', '''        self.load_draft(id);
                  self.transcript = transcript::TranscriptState::new();
                  self.focus_composer = true;''')
          edit(shell, '        if self.creating_task || self.loading_task.is_some() {', '        if self.creating_task || self.loading_task.is_some() || self.selected.is_some_and(|id| self.draft_state.loading.contains(&id)) {')
          edit(shell, 'task.scope == scope && task.state == TaskState::Ready', 'task.scope == scope && task.state == TaskState::Ready && self.drafts.contains_key(&task.id)')
          edit(shell, '        self.busy.insert(id);\n        self.error = None;', '        self.snapshot_draft(cx);\n        self.draft_state.submitted(id, text.clone());\n        self.busy.insert(id);\n        self.error = None;')
          edit(shell, '        match update {\n            Update::Registry', '        match update {\n            Update::DraftLoaded(task, result) => self.restore_draft(task, result, cx),\n            Update::DraftSaved(task, error) => self.draft_saved(task, error, cx),\n            Update::Registry')
          edit(shell, '            Update::Tick => {', '            Update::Tick => {\n                self.flush_drafts(false);')
          edit(shell, '            Update::Event(envelope) => {', '            Update::Event(envelope) => {\n                self.acknowledge_draft(&envelope, cx);')
          edit(shell, '''                    if let ThreadEvent::TextDelta {
                                  role: Role::User,
                                  text,
                                  ..
                              } = &envelope.event
                                  && self.composer.read(cx).text() == text
                              {
                                  self.composer.update(cx, |entry, cx| entry.clear(cx));
                                  if let Some(id) = self.selected {
                                      self.drafts.remove(&id);
                                  }
                              }
          ''', '')
          # Snapshot before all existing deselection paths, including mode/workspace changes.
          for path in [Path(shell), Path('crates/synara-app/src/shell/navigation.rs')]:
              text = path.read_text()
              for owner in ['self', 'this']:
                  text = text.replace(f'{owner}.selected = None;', f'{owner}.snapshot_draft(cx);\n{owner}.selected = None;')
              path.write_text(text); changed.add(str(path))
          add('crates/synara-app/src/shell/drafts.rs', r'''
          //! Debounced per-chat drafts. Serialized writes cannot overtake newer edits.
          use super::*;
          use std::time::{Duration, Instant};
          #[derive(Default)]
          pub(super) struct DraftState {
              dirty: HashMap<TaskId, Instant>, saving: HashSet<TaskId>, failed: HashSet<TaskId>,
              pub loading: HashSet<TaskId>, versions: HashMap<TaskId, u64>,
              sent: HashMap<TaskId, (u64, String)>, quitting: bool,
          }
          impl DraftState {
              fn changed(&mut self, id: TaskId) {
                  self.dirty.insert(id, Instant::now()); self.failed.remove(&id);
                  let version = self.versions.entry(id).or_default(); *version = version.wrapping_add(1);
              }
              pub fn submitted(&mut self, id: TaskId, text: String) {
                  self.sent.insert(id, (self.versions.get(&id).copied().unwrap_or(0), text));
              }
              fn accepted(&mut self, id: TaskId, text: &str) -> bool {
                  let Some((version, sent)) = self.sent.get(&id) else { return false; };
                  if sent != text { return false; }
                  let unchanged = *version == self.versions.get(&id).copied().unwrap_or(0);
                  self.sent.remove(&id); unchanged
              }
              fn due(&mut self, force: bool) -> Vec<TaskId> {
                  let ids: Vec<_> = self.dirty.iter().filter_map(|(id, at)| (!self.saving.contains(id)
                      && (force || (!self.failed.contains(id) && at.elapsed() >= Duration::from_millis(500)))).then_some(*id)).collect();
                  for id in &ids { self.dirty.remove(id); self.saving.insert(*id); }
                  ids
              }
              fn completed(&mut self, id: TaskId, failed: bool) {
                  self.saving.remove(&id);
                  if failed { self.failed.insert(id); self.dirty.entry(id).or_insert_with(Instant::now); }
              }
              fn pending(&self) -> bool { !self.dirty.is_empty() || !self.saving.is_empty() }
          }
          impl Shell {
              pub(super) fn remember_draft(&mut self, cx: &mut Context<Self>) {
                  if let Some(id) = self.selected { self.store_draft(id, self.composer.read(cx).text().to_owned()); }
                  cx.notify();
              }
              pub(super) fn snapshot_draft(&mut self, cx: &mut Context<Self>) {
                  if let Some(id) = self.selected && (self.drafts.contains_key(&id) || !self.composer.read(cx).text().is_empty()) { self.remember_draft(cx); }
              }
              fn store_draft(&mut self, id: TaskId, text: String) {
                  if self.drafts.get(&id) != Some(&text) { self.drafts.insert(id, text); self.draft_state.changed(id); }
              }
              pub(super) fn load_draft(&mut self, id: TaskId) {
                  if self.drafts.contains_key(&id) || !self.draft_state.loading.insert(id) { return; }
                  let workspace = self.controller.workspace.clone();
                  self.job(async move { Ok(Update::DraftLoaded(id, workspace.task_draft(id).await.map_err(|e| e.to_string()))) });
              }
              pub(super) fn restore_draft(&mut self, id: TaskId, result: Result<String, String>, cx: &mut Context<Self>) {
                  self.draft_state.loading.remove(&id);
                  // An intentional clear is also newer local data. A placeholder is not.
                  if self.drafts.contains_key(&id) { return; }
                  match result {
                      Ok(text) => { if self.selected == Some(id) { self.composer.update(cx, |e,cx| e.set_text(text.clone(),cx)); } self.drafts.insert(id,text); }
                      Err(error) if self.selected == Some(id) => self.error = Some(format!("Could not restore chat draft: {error}")),
                      _ => {}
                  }
                  cx.notify();
              }
              pub(super) fn acknowledge_draft(&mut self, envelope: &EventEnvelope, cx: &mut Context<Self>) {
                  let ThreadEvent::TextDelta { role: Role::User, text, .. } = &envelope.event else { return; };
                  let Some(id) = self.catalog.tasks.iter().find(|t| t.thread_id == envelope.thread_id).map(|t|t.id) else { return; };
                  if self.draft_state.accepted(id, text) && self.drafts.get(&id).is_some_and(|draft| draft == text) {
                      self.store_draft(id, String::new());
                      if self.selected == Some(id) { self.composer.update(cx, |e,cx|e.set_text(String::new(),cx)); }
                      self.flush_drafts(true);
                  }
              }
              pub(super) fn flush_drafts(&mut self, force: bool) {
                  self.draft_state.dirty.retain(|id,_| self.catalog.tasks.iter().any(|t|t.id==*id));
                  for id in self.draft_state.due(force) {
                      let text = self.drafts.get(&id).cloned().unwrap_or_default();
                      let workspace = self.controller.workspace.clone();
                      self.job(async move { Ok(Update::DraftSaved(id, workspace.save_task_draft(id,text).await.err().map(|e|e.to_string()))) });
                  }
              }
              pub(super) fn draft_saved(&mut self, id: TaskId, error: Option<String>, cx: &mut Context<Self>) {
                  let exists = self.catalog.tasks.iter().any(|t|t.id==id);
                  self.draft_state.completed(id, error.is_some() && exists);
                  if let Some(error) = error.filter(|_|exists) {
                      self.error = Some(format!("Draft save failed. Your text is still here: {error}"));
                      self.draft_state.quitting = false; self.close.cancel();
                  } else if self.draft_state.quitting {
                      self.flush_drafts(true);
                      if !self.draft_state.pending() { self.draft_state.quitting = false; self.begin_quit(cx); }
                  }
                  cx.notify();
              }
              pub(super) fn save_drafts_before_quit(&mut self, cx: &mut Context<Self>) -> bool {
                  self.snapshot_draft(cx);
                  if !self.draft_state.pending() { return false; }
                  self.draft_state.quitting = true; self.flush_drafts(true);
                  if !self.draft_state.pending() { self.draft_state.quitting=false; return false; }
                  cx.notify(); true
              }
          }
          #[cfg(test)]
          mod tests {
              use super::*;
              #[test]
              fn edits_during_save_are_coalesced_without_reordering() {
                  let id=TaskId::new(); let mut s=DraftState::default();
                  s.changed(id); assert_eq!(s.due(true),vec![id]); s.changed(id); s.changed(id);
                  assert!(s.due(true).is_empty()); s.completed(id,false); assert_eq!(s.due(true),vec![id]);
                  s.completed(id,false); assert!(!s.pending());
              }
              #[test]
              fn save_errors_keep_text_pending_without_a_retry_storm() {
                  let id=TaskId::new(); let mut s=DraftState::default(); s.changed(id); s.due(true); s.completed(id,true);
                  assert!(s.pending()); assert!(s.due(false).is_empty()); assert_eq!(s.due(true),vec![id]);
              }
              #[test]
              fn late_echo_cannot_clear_new_edits_even_when_text_was_retyped_identically() {
                  let id=TaskId::new(); let mut s=DraftState::default(); s.changed(id); s.submitted(id,"hello".into());
                  s.changed(id); s.changed(id); assert!(!s.accepted(id,"hello"));
                  s.submitted(id,"hello".into()); assert!(s.accepted(id,"hello")); assert!(!s.accepted(id,"hello"));
              }
              #[test]
              fn another_chat_or_text_cannot_acknowledge_a_pending_draft() {
                  let id=TaskId::new(); let mut s=DraftState::default(); s.submitted(id,"hello".into());
                  assert!(!s.accepted(TaskId::new(),"hello")); assert!(!s.accepted(id,"other")); assert!(s.accepted(id,"hello"));
              }
          }
          ''')
          # Restore the expected search chrome without modifying input/IME semantics.
          input_path = 'crates/synara-app/src/input.rs'
          edit(input_path, '    leading_icon: Option<crate::ui::Glyph>,', '    leading_icon: Option<crate::ui::Glyph>,\n    picker_chrome: bool,')
