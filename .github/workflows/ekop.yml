name: EKOP isolated verification
on:
  push:
    branches: [astra/session-ekop]
permissions:
  contents: read
concurrency:
  group: ekop-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_BUILD_JOBS: '2'
  PYTHONUTF8: '1'
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ekop'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Format owned source and publish exact test candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --max-parents=0 HEAD)" = '43b1fb89bf19dadc388d18008f9ceb21b8215716'
          test "$(git ls-remote origin refs/heads/astra/session-ekop | cut -f1)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo fmt -p synara-registry
          rustfmt --edition 2024 crates/synara-app/src/shell/registry.rs
          if test -f foundations/browser/lib.rs; then rustfmt --edition 2024 foundations/browser/lib.rs; fi
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              if not (path.startswith('crates/synara-registry/') or path == 'crates/synara-app/src/shell/registry.rs' or path == 'foundations/browser/lib.rs'):
                  raise SystemExit('Formatter changed an unowned path: ' + path)
          PY
          git diff --check
          if ! git diff --quiet; then
            git add -- crates/synara-registry crates/synara-app/src/shell/registry.rs
            if test -f foundations/browser/lib.rs; then git add -- foundations/browser/lib.rs; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(ekop): format owned Rust sources with pinned toolchain'
            git push origin HEAD:refs/heads/astra/session-ekop
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Verified source candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  registry:
    needs: source
    name: registry-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
            host: aarch64-apple-darwin
          - os: windows-2025
            label: windows-x64
            host: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            label: linux-x64
            host: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Install and verify pinned native toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustc -vV
          rustc -vV | grep -F 'host: ${{ matrix.host }}'
          git rev-parse HEAD
      - name: Formatting
        run: |
          cargo fmt --check
          rustfmt --edition 2024 --check foundations/browser/lib.rs
      - name: Compile registry and existing consumers
        if: success() || failure()
        run: cargo check --locked -p synara-registry -p synara-workspace -p synara-acp
      - name: Registry lints
        if: success() || failure()
        run: cargo clippy --locked -p synara-registry --all-targets -- -D warnings
      - name: Registry positive and negative tests
        if: success() || failure()
        run: cargo test --locked -p synara-registry
      - name: Browser policy foundation tests, not native embedding acceptance
        if: success() || failure()
        run: |
          rustc --edition 2024 -D warnings --test foundations/browser/lib.rs -o "$RUNNER_TEMP/browser-policy-tests.exe"
          "$RUNNER_TEMP/browser-policy-tests.exe"
      - name: Integration and privacy-safe measurement harness tests
        if: success() || failure()
        run: |
          python3 --version
          python3 scripts/ekop/integration_audit.py --self-test
          python3 scripts/ekop/measure.py --self-test
      - name: Synthetic measurement harness check, not application performance
        run: |
          python3 scripts/ekop/measure.py --candidate "$(git rev-parse HEAD)" --runs 3 --warmups 1 --timeout 10 --output "$RUNNER_TEMP/ekop-synthetic.json" -- python3 -c 'pass'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekop-synthetic-${{ matrix.label }}
          path: ${{ runner.temp }}/ekop-synthetic.json
          retention-days: 7
          if-no-files-found: warn
  native-app-compile:
    needs: source
    name: app-compile-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
            host: aarch64-apple-darwin
          - os: windows-2025
            label: windows-x64
            host: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Verify native toolchain and candidate
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustc -vV
          rustc -vV | grep -F 'host: ${{ matrix.host }}'
          git rev-parse HEAD
      - name: Compile native GPUI application, not GUI interaction acceptance
        run: cargo check --locked -p synara-app
  linux-native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
          fetch-depth: 1000
      - name: Install pinned Rust and native development libraries
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil fonts-dejavu-core
      - name: Workspace structure and publisher tests
        run: |
          python3 scripts/audit_workspace.py
          python3 scripts/test_apply_source.py
          python3 scripts/check_roadmap.py --self-test
          python3 scripts/check_roadmap.py
      - name: Workspace compilation and lints
        run: |
          cargo fmt --check
          cargo check --locked --workspace
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Build native app and test fixture
        run: cargo build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Isolated native interaction smoke
        timeout-minutes: 4
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "$RUNNER_TEMP/synara-ekop-smoke"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ekop-linux-native-smoke
          path: ${{ runner.temp }}/synara-ekop-smoke/result.json
          retention-days: 7
          if-no-files-found: warn
  source-checkpoint:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Export independently rooted candidate source
        env:
          CANDIDATE: ${{ needs.source.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-list --max-parents=0 HEAD)" = '43b1fb89bf19dadc388d18008f9ceb21b8215716'
          export_dir="$RUNNER_TEMP/ekop-source"
          mkdir "$export_dir"
          git bundle create "$export_dir/source.bundle" HEAD
          git bundle verify "$export_dir/source.bundle"
          git rev-parse HEAD > "$export_dir/revision.txt"
          cp Cargo.lock "$export_dir/Cargo.lock"
          (cd "$export_dir" && sha256sum source.bundle Cargo.lock revision.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ekop-source-checkpoint
          path: ${{ runner.temp }}/ekop-source/
          retention-days: 1
          if-no-files-found: error
