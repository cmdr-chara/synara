name: PR Automations Browser offline inputs
on:
  push:
    branches: [astra/pr-automations-browser]
    paths: [.github/workflows/pr-automations-browser-inputs.yml]
permissions:
  contents: read
jobs:
  tools:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned public toolchain and locked dependency sources
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          mkdir -p /tmp/pab-tools /tmp/pab-sources
          toolchain=$(rustup run 1.98.1 rustc --print sysroot)
          tar -C "$toolchain" -czf /tmp/pab-tools/rust-1.98.1.tar.gz bin lib
          sha256sum /tmp/pab-tools/rust-1.98.1.tar.gz > /tmp/pab-tools/SHA256SUMS
          cargo +1.98.1 vendor --locked /tmp/pab-vendor > /tmp/pab-sources/config.toml
          tar -C /tmp -czf /tmp/pab-sources/vendor.tar.gz pab-vendor
          cp Cargo.lock /tmp/pab-sources/Cargo.lock
          git rev-parse HEAD > /tmp/pab-sources/revision.txt
          git bundle create /tmp/pab-sources/source.bundle HEAD
          sha256sum /tmp/pab-sources/vendor.tar.gz /tmp/pab-sources/Cargo.lock /tmp/pab-sources/source.bundle > /tmp/pab-sources/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pab-rust-toolchain
          path: /tmp/pab-tools/
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pab-locked-sources
          path: /tmp/pab-sources/
          compression-level: 0
          retention-days: 1
  native:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Obtain public native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
      - name: Export libraries into an isolated sysroot, not the local system
        run: |
          python3 - <<'PY'
          import glob, hashlib, pathlib, tarfile
          root = pathlib.Path('/tmp/pab-native')
          root.mkdir()
          paths = ['/usr/include', '/usr/lib/x86_64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']
          names = ['xkbcommon', 'wayland', 'fontconfig', 'freetype', 'asound', 'vulkan', 'EGL', 'GL', 'X', 'xcb', 'ffi', 'zstd', 'brotli', 'bz2', 'png', 'expat', 'uuid', 'z', 'drm', 'gbm', 'udev', 'dbus', 'ssl', 'crypto']
          for name in names:
              paths.extend(glob.glob('/usr/lib/x86_64-linux-gnu/lib' + name + '*.so*'))
          paths.extend(glob.glob('/usr/lib/llvm-*/lib/libclang.so*'))
          archive_path = root / 'native-sysroot.tar.gz'
          with tarfile.open(archive_path, 'w:gz', dereference=True) as archive:
              for name in sorted(set(paths)):
                  if pathlib.Path(name).exists():
                      archive.add(name, arcname=name.lstrip('/'))
          (root / 'SHA256SUMS').write_text(hashlib.file_digest(archive_path.open('rb'), 'sha256').hexdigest() + '  native-sysroot.tar.gz\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pab-native-inputs
          path: /tmp/pab-native/
          compression-level: 0
          retention-days: 1
