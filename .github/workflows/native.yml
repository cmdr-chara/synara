name: Organization feature batch
on:
  push:
    branches: [astra/gpui-clean-rewrite]
permissions:
  contents: write
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  organization-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Wire the exact-base feature batch
        run: python3 scripts/assemble_organization.py
      - name: Install pinned build prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update > /tmp/organization-install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev >> /tmp/organization-install.log 2>&1
      - name: Format and retain exact source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo +1.98.1 fmt -p synara-app -p synara-workspace
          git diff --check
          git add -u
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.request
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          print('CANDIDATE_TREE', git('write-tree'))
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          for path in paths:
              file = pathlib.Path(path)
              if not file.exists():
                  print('SOURCE_DELETE', path)
                  continue
              sha = git('hash-object', '--', path)
              if not path.startswith('.github/'):
                  req = urllib.request.Request('https://api.github.com/repos/cmdr-chara/synara/git/blobs', data=json.dumps({'content': file.read_text(), 'encoding':'utf-8'}).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  with urllib.request.urlopen(req, timeout=30) as response: assert json.load(response)['sha'] == sha
                  time.sleep(0.3)
              print('SOURCE_BLOB', path, sha)
          print(git('diff','--cached','--stat'))
          PY
      - name: Compile application once
        run: cargo +1.98.1 check --locked -p synara-app --bin synara-app
      - name: Focused organization persistence regressions
        run: cargo +1.98.1 test --locked -p synara-workspace --lib storage::organization::tests
      - name: No source mutation
        run: git diff --exit-code
