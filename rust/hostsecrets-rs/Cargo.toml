[package]
name = "hostsecrets-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `packages/shared/src/hostSecrets.ts`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
aes-gcm = "0.10"
aes-kw = "0.2"
hkdf = "0.12"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdh"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
