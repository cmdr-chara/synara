name: Combined Spaces, notes, Studio and Explorer batch
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  organization-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 100
          persist-credentials: false
      - name: Install pinned build prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update > /tmp/org-context-install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation >> /tmp/org-context-install.log 2>&1
      - name: Check the published source without rewriting it
        run: |
          cargo +1.98.1 fmt --check -p synara-app -p synara-workspace -p synara-runtime
          python3 scripts/check_roadmap.py
          git rev-parse HEAD
      - name: Focused organization, context and Studio persistence
        run: |
          cargo +1.98.1 test --locked -p synara-workspace --lib storage::organization::tests
          cargo +1.98.1 test --locked -p synara-workspace --lib storage::task_context::tests
          cargo +1.98.1 test --locked -p synara-workspace --lib studio::tests
      - name: Build application and fixture once
        id: build
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Combined organization and saved-context native journey
        timeout-minutes: 4
        run: python3 scripts/native_organization_context_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/org-context-native
      - name: Studio preview and Explorer file actions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_studio_explorer_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/studio-explorer-native
      - name: Verify candidate identity
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: organization-context-batch
          path: |
            /tmp/org-context-native/*.png
            /tmp/org-context-native/*.log
            /tmp/org-context-native/result.json
            /tmp/studio-explorer-native/*.png
            /tmp/studio-explorer-native/*.log
            /tmp/studio-explorer-native/result.json
          retention-days: 7
          if-no-files-found: warn
