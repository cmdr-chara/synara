name: Apply Windows runtime migration

on:
  push:
    branches:
      - refactor/windows-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply asserted runtime migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: refactor/windows-runtime
          fetch-depth: 1

      - name: Apply shared runtime migration
        run: node scripts/apply-windows-runtime-core.mjs

      - name: Apply server runtime migration
        run: node scripts/apply-windows-runtime-server.mjs

      - name: Apply Effect service migration
        run: node scripts/apply-windows-runtime-effect-services.mjs

      - name: Apply provider adapter migration
        run: node scripts/apply-windows-runtime-provider-adapters.mjs

      - name: Apply desktop runtime migration
        run: node scripts/apply-windows-runtime-desktop.mjs

      - name: Remove one-shot migration scaffolding
        shell: bash
        run: |
          rm -f \
            scripts/apply-windows-runtime-core.mjs \
            scripts/apply-windows-runtime-server.mjs \
            scripts/apply-windows-runtime-effect-services.mjs \
            scripts/apply-windows-runtime-provider-adapters.mjs \
            scripts/apply-windows-runtime-desktop.mjs \
            scripts/windows-runtime-edit-helpers.mjs \
            .github/workflows/apply-windows-runtime-migration.yml

      - name: Verify generated diff
        run: git diff --check

      - name: Commit generated source migration
        shell: bash
        run: |
          git config user.name "Chara"
          git config user.email "legend.alkalex07@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor(windows): migrate application process launches"
          git push origin HEAD:refactor/windows-runtime
