name: Read existing Kanban evidence
on:
  push:
    branches: [astra/gpui-clean-rewrite]
    paths: [docs/ui/kanban-evidence-request.json]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect the already-produced fixture evidence without rebuilding
        env:
          EVIDENCE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections, hashlib, io, os, re, urllib.request, zipfile
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request(
              'https://api.github.com/repos/cmdr-chara/synara/actions/artifacts/10603152761/zip',
              headers={'Authorization': 'Bearer ' + os.environ['EVIDENCE_TOKEN'],
                       'Accept': 'application/vnd.github+json'})
          try:
              urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              raise RuntimeError('Expected an artifact download redirect')
          except urllib.error.HTTPError as error:
              if error.code != 302:
                  raise
              location = error.headers['Location']
          if not location.startswith('https://'):
              raise RuntimeError('Artifact redirect must use HTTPS')
          # Deliberately do not forward the API token to the signed download host.
          with urllib.request.urlopen(location, timeout=30) as response:
              data = response.read(8 * 1024 * 1024 + 1)
          assert len(data) <= 8 * 1024 * 1024
          assert hashlib.sha256(data).hexdigest() == '32aceefb79b073247090625d87ff487ffc14e51fa573744236af046832d31bd1'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              print('Artifact files:', archive.namelist())
              for item in archive.infolist():
                  if 'ui-kanban/' not in item.filename or not item.filename.endswith(('.log', 'result.json')):
                      continue
                  assert item.file_size <= 32 * 1024 * 1024
                  text = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', archive.read(item).decode('utf-8', 'replace'))
                  print('\nEVIDENCE:', item.filename)
                  if item.filename.endswith('result.json'):
                      print(text)
                      continue
                  lines = text.splitlines()
                  controls = collections.Counter(re.findall(r'control="([^"]+)"', text))
                  print('CONTROL COUNTS:', dict(controls))
                  last = {}
                  for line in lines:
                      match = re.search(r'control="([^"]+)"', line)
                      if match:
                          last[match[1]] = line
                  for name in sorted(last):
                      if name.startswith(('kanban', 'task-', 'new-task', 'composer', 'sidebar')):
                          print('LAST CONTROL:', last[name])
                  nonlayout = [line for line in lines if 'control-layout' not in line and 'motion-frame' not in line]
                  print('LAST NON-LAYOUT EVENTS:\n' + '\n'.join(nonlayout[-60:])[-18000:])
          PY
