[package]
name = "providers-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `apps/server/src/providerUsage/providers/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
futures = "0.3"
serde = "1"
sha2 = "0.11"
sha1 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = "0.12"
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
