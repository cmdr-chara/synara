name: Apply residual runtime boundaries

on:
  push:
    branches: [refactor/windows-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Migrate residual launch paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, before, after, count=1):
              p = Path(path)
              source = p.read_text()
              actual = source.count(before)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(source.replace(before, after, count))

          runtime = Path("packages/shared/src/processRuntime.ts")
          source = runtime.read_text()
          marker = '''  );
          }
          '''
          addition = '''  );
          }

          export interface ProcessFileResult {
            readonly stdout: string;
            readonly stderr: string;
          }

          /** Promise counterpart for background jobs and platform services. */
          export function execProcessFilePromise(
            command: string,
            args: ReadonlyArray<string>,
            options: RuntimeExecFileOptions,
          ): Promise<ProcessFileResult> {
            return new Promise((resolve, reject) => {
              execProcessFile(command, args, options, (error, stdout, stderr) => {
                if (error) {
                  reject(error);
                  return;
                }
                resolve({ stdout, stderr });
              });
            });
          }
          '''
          if "export function execProcessFilePromise" not in source:
              if not source.endswith(marker):
                  raise SystemExit("processRuntime.ts append marker not found")
              runtime.write_text(source[:-len(marker)] + addition)

          replace(
              "apps/server/src/git/Layers/GitCore.ts",
              'import { ChildProcess, ChildProcessSpawner } from "effect/unstable/process";',
              'import { ChildProcessSpawner } from "effect/unstable/process";\nimport { makeEffectProcessCommand } from "../../platform/effectProcessRuntime.ts";',
          )
          replace(
              "apps/server/src/git/Layers/GitCore.ts",
              'ChildProcess.make("git", commandInput.args, {',
              'makeEffectProcessCommand("git", commandInput.args, {',
          )

          replace(
              "apps/desktop/src/main.ts",
              'import * as ChildProcess from "node:child_process";',
              'import type { ChildProcess } from "node:child_process";\nimport { spawnProcess } from "@synara/shared/processRuntime";',
          )
          replace(
              "apps/desktop/src/main.ts",
              "ChildProcess.ChildProcess",
              "ChildProcess",
              2,
          )
          replace(
              "apps/desktop/src/main.ts",
              "ChildProcess.spawn(",
              "spawnProcess(",
              2,
          )

          replace(
              "apps/server/src/provider/claudeCredentialKeepalive.ts",
              'import { execFile } from "node:child_process";\nimport { promisify } from "node:util";\n',
              'import { execProcessFilePromise } from "@synara/shared/processRuntime";\n',
          )
          replace(
              "apps/server/src/provider/claudeCredentialKeepalive.ts",
              "\nconst execFileAsync = promisify(execFile);\n",
              "\n",
          )
          replace(
              "apps/server/src/provider/claudeCredentialKeepalive.ts",
              "    await execFileAsync(binaryPath, [...CLAUDE_CREDENTIAL_KEEPALIVE_AUTH_STATUS_ARGS], {",
              "    await execProcessFilePromise(binaryPath, CLAUDE_CREDENTIAL_KEEPALIVE_AUTH_STATUS_ARGS, {",
          )
          PY
      - name: Format and commit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run fmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/src/processRuntime.ts apps/server/src/git/Layers/GitCore.ts apps/desktop/src/main.ts apps/server/src/provider/claudeCredentialKeepalive.ts
          git diff --cached --quiet && { echo "No migrations produced"; exit 1; }
          git commit -m "refactor(windows): close residual process launch bypasses"
          git push origin HEAD
