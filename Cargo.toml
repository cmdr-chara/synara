[workspace]
members = ["crates/synara-core", "crates/synara-runtime", "crates/synara-agent", "crates/synara-acp", "crates/synara-workspace", "crates/synara-app", "crates/synara-registry", "crates/synara-browser"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[profile.test]
debug = 0
