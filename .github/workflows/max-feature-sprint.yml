name: Max feature sprint
on:
  push:
    branches: [astra/max-feature-sprint]
    paths: [.github/workflows/max-feature-sprint.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact source
        run: |
          mkdir -p /tmp/max-feature-sprint
          git rev-parse HEAD > /tmp/max-feature-sprint/revision.txt
          git bundle create /tmp/max-feature-sprint/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: max-feature-sprint-source
          path: /tmp/max-feature-sprint/
          retention-days: 7
