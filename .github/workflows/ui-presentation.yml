              }
              fn star_model(&mut self,index:usize,cx:&mut Context<Self>) {
                  self.navigation.armed=None;
                  let Some(state)=&mut self.models else {return;};
                  if !state.ready || state.saving {return;}
                  let Some(favorite)=state.rows.get(index).and_then(|r|r.favorite.clone()) else {return;};
                  let enabled=!state.favorites.contains(&favorite);
                  let workspace=state.workspace.clone();
                  state.saving=true;state.error=None;
                  let job=state.runtime.spawn(async move {workspace.set_model_favorite(favorite,enabled).await});
                  cx.spawn(async move |view,cx| {
                      let result=job.await;
                      let _=view.update(cx,|this,cx| {
                          if let Some(state)=&mut this.models {
                              state.saving=false;
                              match result {Ok(Ok(favorites))=>state.favorites=favorites,_=>state.error=Some("Favorite was not saved. Try again.".into())}
                          }
                          this.filter(this.query.clone(),cx);
                      });
                  }).detach();cx.notify();
              }
              pub(super) fn model_status(&self)->gpui::AnyElement {
                  let Some(state)=&self.models else {return div().into_any_element();};
                  let status=state.error.as_deref().unwrap_or(if state.saving {"Saving favorites..."} else if !state.ready {"Loading favorites..."} else {"Alt + Left / Right changes source. Star models to save them."});
