name: Cross-platform visual accessibility save-picker acceptance
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed commit represented by the evidence
        required: true
        type: string
      platform:
        description: Platform represented by the reviewed live evidence
        required: true
        type: choice
        options: [macos, windows, linux]
      evidence_path:
        description: Absolute path to reviewed synara-a10-live-v1 evidence on the self-hosted runner
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: live-ui-accessibility-acceptance-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  macos:
    if: inputs.platform == 'macos'
    runs-on: [self-hosted, macOS, ARM64, synara-live-ui]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate reviewed macOS VoiceOver/accessibility evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.revision }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
          mkdir -p acceptance-evidence
          python3 scripts/validate_a10_live_evidence.py \
            --revision "${{ inputs.revision }}" \
            --platform macos \
            --evidence "${{ inputs.evidence_path }}" \
            --summary-out acceptance-evidence/macos-summary.json
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a10-macos-summary
          path: acceptance-evidence/macos-summary.json
          retention-days: 7

  windows:
    if: inputs.platform == 'windows'
    runs-on: [self-hosted, Windows, X64, synara-live-ui]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate reviewed Windows Narrator/UIA evidence
        shell: pwsh
        run: |
          if ("${{ inputs.revision }}" -notmatch "^[0-9a-f]{40}$") { throw "revision must be a full SHA" }
          if ((git rev-parse HEAD) -ne "${{ inputs.revision }}") { throw "wrong candidate" }
          New-Item -ItemType Directory -Force acceptance-evidence | Out-Null
          python scripts/validate_a10_live_evidence.py --revision "${{ inputs.revision }}" --platform windows --evidence "${{ inputs.evidence_path }}" --summary-out acceptance-evidence/windows-summary.json
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a10-windows-summary
          path: acceptance-evidence/windows-summary.json
          retention-days: 7

  linux:
    if: inputs.platform == 'linux'
    runs-on: [self-hosted, Linux, X64, synara-live-ui]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate reviewed Linux AT-SPI/screen-reader evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.revision }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ inputs.revision }}"
          mkdir -p acceptance-evidence
          python3 scripts/validate_a10_live_evidence.py \
            --revision "${{ inputs.revision }}" \
            --platform linux \
            --evidence "${{ inputs.evidence_path }}" \
            --summary-out acceptance-evidence/linux-summary.json
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a10-linux-summary
          path: acceptance-evidence/linux-summary.json
          retention-days: 7
