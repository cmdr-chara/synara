name: Copilot Transform

on:
  push:
    branches:
      - agent/copilot-provider-wiring

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Apply exact local Copilot wiring patch
        shell: bash
        run: |
          cat .automation.patch.b64.* | base64 -d | gzip -d > /tmp/copilot-wiring.patch
          git apply --whitespace=nowarn /tmp/copilot-wiring.patch
          rm -f .automation.patch.b64.* .automation.py .automation-touch .automation-error.log .automation-result
          rm -f .github/workflows/branch-worker.yml
          bun run fmt
      - name: Commit transformed provider wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(provider): wire GitHub Copilot as a first-class provider"
          git push
