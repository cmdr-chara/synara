name: Native verification
on:
  push:
    branches: [astra/gpui-clean-rewrite]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/gpui-clean-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1000
      - name: Import the exact verified artifact and restore the normal workflow
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,subprocess,urllib.error,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          base='1828d1e9366e9ea71406b0e37027abb9ae24594a'
          assert subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).strip()==base
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          assert not Path('.synara-source.json').exists()
          token=os.environ.pop('GH_ARTIFACT_TOKEN')
          api='https://api.github.com/repos/cmdr-chara/synara/actions/artifacts/10595260455'
          digest='3b6030d3f9bf6240d3d45ca71ae20ef2a7d334a672b9f1da420504fb2ea442f8'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          with opener.open(urllib.request.Request(api,headers=headers),timeout=30) as response:
              metadata=json.load(response)
          assert metadata['id']==10595260455 and not metadata['expired']
          assert metadata['name']=='focused-native-presentation'
          assert metadata['workflow_run']['id']==35477290881
          assert metadata['workflow_run']['head_sha']==base
          assert metadata['digest']=='sha256:'+digest
          try:
              opener.open(urllib.request.Request(api+'/zip',headers=headers),timeout=30)
              raise RuntimeError('Expected a signed artifact redirect')
          except urllib.error.HTTPError as error:
              if error.code not in (301,302,303,307,308): raise
              location=error.headers['Location']
          target=urllib.parse.urlparse(location)
          assert target.scheme=='https' and target.hostname and not target.username and not target.password
          assert target.port in (None,443)
          # No GitHub authorization header is forwarded to artifact storage.
          with opener.open(urllib.request.Request(location),timeout=60) as response:
              data=response.read(8*1024*1024+1)
          assert len(data)<=8*1024*1024 and hashlib.sha256(data).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              names=[entry for entry in archive.infolist() if entry.filename.endswith('/package.json') or entry.filename=='package.json']
              assert len(names)==1 and names[0].file_size<=8*1024*1024
              package=json.loads(archive.read(names[0]))
          assert package['base_commit']==base and package['mode']=='diff'
          assert package['sha256']=='c696d58c43fc17487186d0ffc3b72138f9c2f786488d5894d77816500cba2c7a'
          normal=subprocess.check_output(['git','show',base+':.github/workflows/native.yml'])
          blob=subprocess.check_output(['git','hash-object','--stdin'],input=normal).decode().strip()
          assert blob=='1f217a0c2d8a78140f8339687c1ac30909a3f26d'
          Path('.github/workflows/native.yml').write_bytes(normal)
          Path('.synara-source.json').write_text(json.dumps(package),encoding='utf-8')
          print('Verified artifact digest, originating candidate and source delta. Normal workflow restored for publication.')
          PY
      - name: Apply the integrity-checked source package
        id: publish
        run: python3 scripts/apply_source.py
  presentation:
    needs: source
    uses: ./.github/workflows/ui-presentation.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
