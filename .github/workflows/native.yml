name: Native verification
on:
  push:
    branches: [astra/gpui-clean-rewrite]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/gpui-clean-rewrite'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1000
      - name: Apply an optional checked source package
        id: publish
        run: python3 scripts/apply_source.py
  linux:
    needs: source
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.source.outputs.revision }}
          fetch-depth: 1000
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core
      - name: Fetch pinned dependencies
        run: cargo +1.98.1 fetch --locked
      - name: Choose dependency cache export
        id: cache
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- Cargo.lock rust-toolchain.toml; then
            echo 'export=false' >> "$GITHUB_OUTPUT"
          else
            echo 'export=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Export dependency and native development cache
        if: always() && steps.cache.outputs.export == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/native-metadata /tmp/native-cache
          git bundle create /tmp/native-metadata/source.bundle HEAD
          git rev-parse HEAD > /tmp/native-metadata/revision.txt
          if test -f Cargo.lock; then cp Cargo.lock /tmp/native-metadata/Cargo.lock; fi
          paths=()
          for path in registry git; do
            if test -d "$HOME/.cargo/$path"; then paths+=("$path"); fi
          done
          if test "${#paths[@]}" -gt 0; then tar -C "$HOME/.cargo" -czf /tmp/native-cache/dependencies.tar.gz "${paths[@]}"; fi
          python3 - <<'PY'
          import glob, pathlib, tarfile
          paths = ['/usr/include', '/usr/lib/x86_64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']
          names = ['xkbcommon', 'wayland', 'fontconfig', 'freetype', 'asound', 'vulkan', 'EGL', 'GL', 'X', 'xcb', 'ffi', 'zstd', 'brotli', 'bz2', 'png', 'expat', 'uuid', 'z', 'drm', 'gbm', 'udev', 'dbus']
          for name in names:
              paths.extend(glob.glob('/usr/lib/x86_64-linux-gnu/lib' + name + '*.so*'))
          paths.extend(glob.glob('/usr/lib/llvm-*/lib/libclang.so*'))
          with tarfile.open('/tmp/native-metadata/native-sysroot.tar.gz', 'w:gz', dereference=True) as archive:
              for name in sorted(set(paths)):
                  if pathlib.Path(name).exists(): archive.add(name, arcname=name.lstrip('/'))
          PY
          split -b 400M -d /tmp/native-cache/dependencies.tar.gz /tmp/native-cache/dependencies.part-
          sha256sum /tmp/native-cache/dependencies.tar.gz > /tmp/native-metadata/dependencies.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.cache.outputs.export == 'true'
        with:
          name: native-metadata
          path: /tmp/native-metadata/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.cache.outputs.export == 'true'
        with:
          name: native-dependencies-00
          path: /tmp/native-cache/dependencies.part-00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.cache.outputs.export == 'true'
        with:
          name: native-dependencies-01
          path: /tmp/native-cache/dependencies.part-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.cache.outputs.export == 'true'
        with:
          name: native-dependencies-02
          path: /tmp/native-cache/dependencies.part-02
          retention-days: 1
          compression-level: 0
      - name: Workspace structure
        run: python3 scripts/audit_workspace.py
      - name: Formatting
        run: cargo +1.98.1 fmt --check
      - name: Compile
        if: always()
        run: cargo +1.98.1 check --locked --workspace
      - name: Lints
        if: always()
        run: cargo +1.98.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        if: always()
        run: cargo +1.98.1 test --locked --workspace
      - name: Publisher regression tests
        if: always()
        run: python3 scripts/test_apply_source.py
      - name: Build native application and ACP fixture
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Native desktop interaction smoke
        timeout-minutes: 3
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-native-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-desktop-smoke
          path: |
            /tmp/synara-native-smoke/*.png
            /tmp/synara-native-smoke/*.log
            /tmp/synara-native-smoke/result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Native navigation and backend interaction smoke
        timeout-minutes: 4
        run: python3 scripts/native_navigation_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-navigation-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-navigation-smoke
          path: |
            /tmp/synara-navigation-smoke/*.png
            /tmp/synara-navigation-smoke/result.json
          retention-days: 7
          if-no-files-found: warn
      - name: Export reproducible verification inputs
        if: always()
        run: |
          mkdir -p /tmp/native-build-inputs
          git bundle create /tmp/native-build-inputs/source.bundle HEAD
          git rev-parse HEAD > /tmp/native-build-inputs/revision.txt
          if test -f Cargo.lock; then cp Cargo.lock /tmp/native-build-inputs/Cargo.lock; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-linux-build-inputs
          path: /tmp/native-build-inputs/
          retention-days: 1
          compression-level: 0
