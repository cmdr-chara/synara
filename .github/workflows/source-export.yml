name: Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/upload-artifact@v4
        with:
          name: synara-source
          include-hidden-files: true
          path: |
            .
            !.git
