name: Onboarding acceptance foundation
on:
  push:
    branches: [main]
    paths:
      - 'crates/synara-app/src/shell.rs'
      - 'crates/synara-app/src/shell/onboarding.rs'
      - 'crates/synara-app/src/shell/onboarding/**'
      - 'scripts/native_onboarding_foundation_smoke.py'
      - 'scripts/native_smoke.py'
      - '.github/workflows/onboarding-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: onboarding-acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  first-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install native fixture prerequisites
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - name: Build actual GPUI app and ACP fixture
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Exercise full hermetic first-run path
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          python3 scripts/native_onboarding_foundation_smoke.py             --binary target/debug/synara-app             --fixture target/debug/synara-acp-fixture             --output acceptance-evidence/onboarding 2>&1 | tee acceptance-evidence/onboarding.log
          grep -q 'A04_FOUNDATION_ACCEPTANCE:' acceptance-evidence/onboarding.log
      - name: Verify exact candidate stayed unchanged
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD > acceptance-evidence/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onboarding-acceptance-foundation
          path: acceptance-evidence/
          retention-days: 7
          if-no-files-found: error
