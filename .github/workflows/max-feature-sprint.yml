name: Max feature sprint
on:
  push:
    branches: [astra/max-feature-sprint]
    paths: [.synara-max-feature.json]
permissions:
  contents: write
concurrency:
  group: max-feature-sprint
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify source transport before installing dependencies
        run: |
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, io, json, re
          from pathlib import Path
          path = Path('.synara-max-feature.json')
          assert not path.is_symlink() and path.stat().st_size <= 8 * 1024 * 1024
          package = json.loads(path.read_text())
          parts = package['parts']
          assert isinstance(parts, list) and 1 <= len(parts) <= 16
          assert len(set(parts)) == len(parts)
          assert all(isinstance(p, str) and re.fullmatch(r'\.synara-transfer-[0-9]{4}', p) for p in parts)
          assert all(not Path(p).is_symlink() for p in parts)
          assert sum(Path(p).stat().st_size for p in parts) <= 8 * 1024 * 1024
          repairs = {
              '.synara-transfer-0001': ('169069918b03f974439d9c074a7c388b4016a7a1', '0f428372290427f12252f450ac5717813e5a36df', [(371, '6', '+'), (1144, '', '3P')]),
              '.synara-transfer-0003': ('eb196dbfc70332032312e1649ded698fc69229d8', '5a34fe95793b3852bc4338a3eb9848607fea6245', [(6411, '', '/'), (9177, '', '/')]),
          }
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for name, (old_sha, new_sha, edits) in repairs.items():
              data = Path(name).read_bytes()
              assert blob_sha(data) == old_sha
              text = data.decode('ascii')
              for offset, old, new in reversed(edits):
                  assert text[offset:offset + len(old)] == old
                  text = text[:offset] + new + text[offset + len(old):]
              assert blob_sha(text.encode()) == new_sha
              Path(name).write_text(text, encoding='ascii')
          encoded = ''.join(Path(p).read_text().strip() for p in parts)
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded, validate=True))) as stream:
              data = stream.read(20 * 1024 * 1024 + 1)
          assert len(data) <= 20 * 1024 * 1024
          assert hashlib.sha256(data).hexdigest() == package['sha256'], 'Source transport checksum mismatch'
          PYCODE
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deps
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: max-feature-1.98.1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            max-feature-1.98.1-${{ runner.os }}-
            native-webkit-1.98.1-${{ runner.os }}-
      - name: Apply, validate, and publish only the session branch
        id: source
        run: |
          mkdir -p /tmp/max-feature-evidence
          set -o pipefail
          python3 scripts/apply_max_feature_source.py 2>&1 | tee /tmp/max-feature-evidence/validation.log
      - name: Preserve exact candidate and evidence
        if: always()
        run: |
          mkdir -p /tmp/max-feature-evidence
          git rev-parse HEAD > /tmp/max-feature-evidence/revision.txt
          git status --short > /tmp/max-feature-evidence/status.txt
          git diff HEAD > /tmp/max-feature-evidence/candidate.patch
          cp Cargo.lock /tmp/max-feature-evidence/Cargo.lock
          git bundle create /tmp/max-feature-evidence/source.bundle HEAD ^e12fffbb868fb80f4a3e891d3d3a4afad3a3743b
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-feature-evidence
          path: /tmp/max-feature-evidence/
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.deps.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: max-feature-1.98.1-${{ runner.os }}-${{ github.sha }}
      - name: Export bounded offline Rust validation tools
        if: always()
        run: |
          mkdir -p /tmp/max-feature-tools
          tar -C "$HOME" -I 'xz -T2 -3' -cf /tmp/rust-offline.tar.xz .rustup/toolchains/1.98.1-x86_64-unknown-linux-gnu .cargo/bin .cargo/registry .cargo/git
          split --bytes=240M --numeric-suffixes --suffix-length=2 /tmp/rust-offline.tar.xz /tmp/max-feature-tools/part-
          sha256sum /tmp/rust-offline.tar.xz > /tmp/max-feature-tools/sha256.txt
          test ! -e /tmp/max-feature-tools/part-03
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-feature-tools-00
          path: |
            /tmp/max-feature-tools/part-00
            /tmp/max-feature-tools/sha256.txt
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-feature-tools-01
          path: /tmp/max-feature-tools/part-01
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: max-feature-tools-02
          path: /tmp/max-feature-tools/part-02
          retention-days: 3
