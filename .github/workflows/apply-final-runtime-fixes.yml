name: Apply final runtime fixes

on:
  push:
    branches: [refactor/windows-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, before, after, count=1):
              p = Path(path)
              source = p.read_text()
              actual = source.count(before)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(source.replace(before, after, count))

          replace(
              "apps/server/src/platform/supervisedProcessTeardown.ts",
              "  readonly pid: number | undefined;",
              "  readonly pid?: number | undefined;",
          )
          replace(
              "apps/server/src/provider/providerStartupLifecycle.integration.test.ts",
              'import { fileURLToPath } from "node:url";',
              'import type { ChildProcessWithoutNullStreams } from "node:child_process";\nimport { fileURLToPath } from "node:url";',
          )
          replace(
              "apps/server/src/provider/providerStartupLifecycle.integration.test.ts",
              "function stopChild(child: ReturnType<typeof spawnProcess> | null): Promise<void> {",
              "function stopChild(child: ChildProcessWithoutNullStreams | null): Promise<void> {",
          )
          replace(
              "apps/server/src/provider/providerStartupLifecycle.integration.test.ts",
              "  let child: ReturnType<typeof spawnProcess> | null = null;",
              "  let child: ChildProcessWithoutNullStreams | null = null;",
          )
          PY
      - name: Format and commit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run fmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages .docs
          git diff --cached --quiet && { echo "No fixes produced"; exit 1; }
          git commit -m "fix(windows): finalize runtime typings and fixtures"
          git push origin HEAD
