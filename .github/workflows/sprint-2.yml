name: Native conversation workflow regression
on:
  push:
    branches: [astra/max-feature-sprint-2, astra/gpui-clean-rewrite]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/sprint-2.yml'
  pull_request:
    branches: [astra/gpui-clean-rewrite]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'scripts/**', '.github/workflows/sprint-2.yml']
permissions:
  contents: read
concurrency:
  group: native-conversation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: 1
      RUST_BACKTRACE: 0
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned compiler and native prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-conversation-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            native-conversation-${{ runner.os }}-
            sprint-2-v1-${{ runner.os }}-
      - name: Source, roadmap and baseline checks
        run: |
          mkdir -p /tmp/native-conversation-evidence
          set -o pipefail
          python3 scripts/verify_sprint2_integration.py --output /tmp/native-conversation-evidence 2>&1 | tee /tmp/native-conversation-evidence/source-checks.log
          git diff --name-only --diff-filter=ACM fe515833c565d666204f24e5257d85025dede0e9 HEAD -- '*.rs' > /tmp/native-conversation-evidence/rustfmt-paths.txt
          xargs -r rustfmt +1.98.1 --check --edition 2024 --config skip_children=true < /tmp/native-conversation-evidence/rustfmt-paths.txt
          python3 scripts/check_roadmap.py 2>&1 | tee /tmp/native-conversation-evidence/roadmap.log
          python3 -m unittest discover -s scripts -p 'test_audit_workspace.py' 2>&1 | tee /tmp/native-conversation-evidence/audit-tests.log
          python3 scripts/check_roadmap.py --self-test 2>&1 | tee /tmp/native-conversation-evidence/roadmap-tests.log
      - name: Accumulated Rust regression
        run: |
          set -o pipefail
          cargo +1.98.1 test --locked -p synara-core -p synara-runtime -p synara-model -p synara-workspace --lib 2>&1 | tee /tmp/native-conversation-evidence/rust-libraries.log
          cargo +1.98.1 test --locked -p synara-app --bin synara-app 2>&1 | tee /tmp/native-conversation-evidence/rust-app.log
          cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture 2>&1 | tee /tmp/native-conversation-evidence/build.log
      - name: Native user journeys and direct-model regression
        run: |
          set -o pipefail
          for script in native_sprint2_debug_smoke native_sprint2_pr_fix_smoke native_sprint2_file_comments_smoke native_sprint2_releases_smoke native_sprint2_recap_smoke native_direct_models_smoke; do
            python3 "scripts/$script.py" --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "/tmp/native-conversation-evidence/$script" 2>&1 | tee "/tmp/native-conversation-evidence/$script.log"
          done
      - name: Confirm tests left source unchanged
        run: |
          test -z "$(git status --porcelain)"
          git diff --exit-code
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/native-conversation-evidence
          git rev-parse HEAD > /tmp/native-conversation-evidence/revision.txt
          git status --short > /tmp/native-conversation-evidence/status.txt
          git bundle create /tmp/native-conversation-evidence/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-conversation-evidence
          path: /tmp/native-conversation-evidence/
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-conversation-${{ runner.os }}-${{ github.sha }}
