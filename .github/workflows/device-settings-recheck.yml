name: Device Settings focused corrective checks
on:
  push:
    branches: [astra/device-settings]
    paths: [.github/workflows/device-settings-recheck.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/device-settings'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Publish exact corrective patch on session branch only
        id: publish
        env:
          PUBLISH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, subprocess as s
          from pathlib import Path
          BASE = '9e941c56bd3b494a2445771b34199d3aea495596'
          BRANCH = 'refs/heads/astra/device-settings'
          PATCH = 'scripts/device-settings-fix.patch'
          WORKFLOW = '.github/workflows/device-settings-recheck.yml'
          def git(*args):
              return s.check_output(['git', *args]).decode().strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'cmdr-chara/synara'
          assert os.environ['GITHUB_REF'] == BRANCH
          assert not git('status', '--porcelain')
          assert git('show', '-s', '--format=%P', 'HEAD') == BASE
          assert sorted(git('diff', '--name-only', BASE, 'HEAD').splitlines()) == sorted([PATCH, WORKFLOW])
          assert git('ls-remote', 'origin', BRANCH).split()[0] == git('rev-parse', 'HEAD')
          patch = Path(PATCH).read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '1897fa74a8030a883dbf16ca9d015517ba5ba2b49b5f260695fc71c78e69b041'
          s.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          s.run(['git', 'apply', '--index', '--whitespace=error-all', '-'], input=patch, check=True)
          s.run(['git', 'rm', '--', PATCH, WORKFLOW], check=True)
          assert git('write-tree') == 'ca9f8b3c62f0f71936a452fdfac5d20337f3d89d'
          paths = ['crates/synara-app/src/shell/settings/native.rs', 'crates/synara-workspace/src/device_capture.rs', 'crates/synara-workspace/src/settings/keybindings.rs']
          s.run(['rustfmt', '+1.98.1', '--edition', '2024', '--config', 'skip_children=true', *paths], check=True)
          assert set(git('diff', '--name-only').splitlines()).issubset(paths)
          s.run(['git', 'add', '--', *paths], check=True)
          s.run(['git', 'diff', '--cached', '--check'], check=True)
          s.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix(device): correct runtime exports and tighten capture and shortcut bounds [skip ci]'], check=True)
          assert not git('status', '--porcelain')
          env = dict(os.environ)
          token = env.pop('PUBLISH_TOKEN')
          env['GIT_CONFIG_COUNT'] = '1'
          env['GIT_CONFIG_KEY_0'] = 'http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0'] = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + token).encode()).decode()
          s.run(['git', 'push', 'origin', 'HEAD:' + BRANCH], env=env, check=True)
          revision = git('rev-parse', 'HEAD')
          assert git('ls-remote', 'origin', BRANCH).split()[0] == revision
          out = Path('/tmp/device-settings-recheck-source')
          out.mkdir(exist_ok=True)
          (out / 'revision.txt').write_text(revision + '\n')
          s.run(['git', 'bundle', 'create', str(out / 'source.bundle'), 'HEAD'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('revision=' + revision + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: device-settings-recheck-source
          path: /tmp/device-settings-recheck-source/
          retention-days: 7
  focused-checks:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.publish.outputs.revision }}
          persist-credentials: false
      - name: Install pinned compiler and native compile prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update > /tmp/device-settings-install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev >> /tmp/device-settings-install.log 2>&1
      - name: Focused device and Settings regressions and native compilation
        run: |
          set +e
          mkdir -p /tmp/device-settings-recheck-results
          git rev-parse HEAD > /tmp/device-settings-recheck-results/revision.txt
          status=0
          run_check() {
            name="$1"
            shift
            "$@" > "/tmp/device-settings-recheck-results/$name.log" 2>&1
            result=$?
            printf '%s %s\n' "$name" "$result" | tee -a /tmp/device-settings-recheck-results/results.txt
            if [ "$result" -ne 0 ]; then tail -100 "/tmp/device-settings-recheck-results/$name.log"; status=1; fi
          }
          run_check runtime-devices cargo +1.98.1 test --locked -p synara-runtime --lib device_tools
          run_check device-protocol cargo +1.98.1 test --locked -p synara-runtime --lib device::tests
          run_check capture cargo +1.98.1 test --locked -p synara-workspace --lib device_capture
          run_check settings cargo +1.98.1 test --locked -p synara-workspace --lib settings::
          run_check environment cargo +1.98.1 test --locked -p synara-workspace --lib environment::tests
          run_check archived-deletion cargo +1.98.1 test --locked -p synara-workspace --lib device_settings_tests
          run_check native-check cargo +1.98.1 check --locked -p synara-app --bin synara-app
          run_check roadmap python3 scripts/check_roadmap.py
          run_check clean-tree git diff --exit-code
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: device-settings-focused-recheck
          path: |
            /tmp/device-settings-recheck-results/
            /tmp/device-settings-install.log
          retention-days: 7
