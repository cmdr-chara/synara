name: FGH isolated verification
on:
  push:
    branches: [astra/session-fgh]
permissions:
  contents: read
concurrency:
  group: fgh-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  linux:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-fgh'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify session ancestry
        run: |
          git merge-base --is-ancestor 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121 HEAD
          git rev-parse HEAD
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Export run-scoped offline toolchain
        if: contains(github.event.head_commit.message, 'ci(fgh): verify isolated')
        run: |
          mkdir -p /tmp/fgh-toolchain
          toolchain=$(rustup run 1.98.1 rustc --print sysroot)
          tar -C "$toolchain" -czf /tmp/fgh-toolchain/rust-1.98.1.tar.gz bin lib
          sha256sum /tmp/fgh-toolchain/rust-1.98.1.tar.gz > /tmp/fgh-toolchain/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: contains(github.event.head_commit.message, 'ci(fgh): verify isolated')
        with:
          name: fgh-offline-toolchain
          path: /tmp/fgh-toolchain/
          retention-days: 1
          compression-level: 0
      - name: Native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil fonts-dejavu-core
      - name: Fetch locked dependencies
        run: cargo +1.98.1 fetch --locked
      - name: Workspace structure
        run: python3 scripts/audit_workspace.py
      - name: Formatting
        run: cargo +1.98.1 fmt --check
      - name: Compile
        if: always()
        run: cargo +1.98.1 check --locked --workspace
      - name: Lints
        if: always()
        run: cargo +1.98.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        if: always()
        run: cargo +1.98.1 test --locked --workspace
      - name: Publisher and roadmap regression tests
        if: always()
        run: |
          python3 scripts/test_apply_source.py
          python3 scripts/check_roadmap.py --self-test
          python3 scripts/check_roadmap.py
      - name: Build native application and fixture
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Native desktop interaction smoke
        timeout-minutes: 3
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/synara-fgh-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fgh-native-desktop-smoke
          path: |
            /tmp/synara-fgh-smoke/*.png
            /tmp/synara-fgh-smoke/*.log
            /tmp/synara-fgh-smoke/result.json
          retention-days: 7
          if-no-files-found: warn
