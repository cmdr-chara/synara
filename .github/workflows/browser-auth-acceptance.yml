name: Authenticated browser acceptance
on:
  push:
    branches: [main]
    paths:
      - 'crates/synara-browser/**'
      - '.github/workflows/browser-auth-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: browser-auth-acceptance-${{ github.ref }}
  cancel-in-progress: true
env:
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  webkit-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record exact candidate
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          git rev-parse HEAD | tee acceptance-evidence/revision.txt
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install real WebKitGTK/X11 prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Verify authentication partition and popup authority
        run: |
          set -euo pipefail
          cargo +1.98.1 test --locked -p synara-browser --features native-webview --lib session::tests::authentication_popup_retains_flow_partition_and_agent_isolation -- --exact --nocapture 2>&1 | tee acceptance-evidence/partition.log
          grep -q 'test result: ok. 1 passed' acceptance-evidence/partition.log
      - name: Real WebKit authenticated login, session and popup
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' cargo +1.98.1 test --locked -p synara-browser --features native-webview --lib real_webkit_authentication_login_session_and_popup -- --ignored --test-threads=1 --nocapture 2>&1 | tee acceptance-evidence/authentication.log
          grep -q 'AUTH_WEBKIT_ACCEPTANCE: login cookie, explicit popup, shared auth session, manual isolation' acceptance-evidence/authentication.log
      - name: Browser formatting and strict Clippy
        run: |
          cargo +1.98.1 fmt --all --check
          cargo +1.98.1 clippy --locked -p synara-browser --features native-webview --all-targets -- -D warnings
      - name: Verify candidate identity
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authenticated-browser-acceptance
          path: acceptance-evidence/
          retention-days: 7
          if-no-files-found: error
