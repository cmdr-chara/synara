[package]
name = "index"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `index`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "index"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
staticassets-rs = { path = "../staticassets-rs" }

[workspace]
