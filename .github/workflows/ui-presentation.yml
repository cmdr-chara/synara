name: Focused native presentation
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record candidate and check scope selection
        run: |
          git rev-parse HEAD
          python3 scripts/test_native_ui_scope.py
          python3 -m py_compile scripts/native_picker_search_smoke.py scripts/native_rich_text_smoke.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - name: App formatting
        run: cargo +1.98.1 fmt --check -p synara-app
      - name: Presentation unit regressions
        if: ${{ !cancelled() }}
        run: cargo +1.98.1 test --locked -p synara-app --bin synara-app ui::
      - name: Session choice contract regressions
        if: ${{ !cancelled() }}
        run: cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::controls::tests
      - name: Build native application and fixture
        if: ${{ !cancelled() }}
        id: build
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Existing native control journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_controls_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-controls
      - name: Search and filtered activation journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 scripts/native_picker_search_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-picker-search
      - name: Existing transcript and split layout journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 scripts/native_chat_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-chat
      - name: Native rich text and copy journeys
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: python3 scripts/native_rich_text_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-rich-text
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: focused-native-presentation
          path: |
            /tmp/ui-*/*.png
            /tmp/ui-*/*.log
            /tmp/ui-*/result.json
          retention-days: 7
          if-no-files-found: warn
