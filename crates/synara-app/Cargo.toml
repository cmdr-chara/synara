[package]
name = "synara-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
synara-model = { path = "../synara-model" }
synara-browser = { path = "../synara-browser", features = ["native-webview"] }
synara-registry = { path = "../synara-registry" }
synara-core = { path = "../synara-core" }
synara-agent = { path = "../synara-agent" }
synara-acp = { path = "../synara-acp" }
synara-runtime = { path = "../synara-runtime" }
synara-workspace = { path = "../synara-workspace" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "aec7395e30feba9139c9ab8b9444d672882ddf41" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "aec7395e30feba9139c9ab8b9444d672882ddf41", features = ["font-kit", "wayland", "x11"] }
async-channel = "2.5"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = "=0.4.45"
pulldown-cmark = { version = "=0.13.4", default-features = false }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json", "stream"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "=0.17.1"

[lints]
workspace = true
