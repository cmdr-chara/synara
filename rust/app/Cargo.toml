[package]
name = "index"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `index`, generated by rust-anything: Rust owns the server, the original answers what is not ported yet"

[[bin]]
name = "index"
path = "src/main.rs"

[dependencies]
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
tokio = { version = "1", features = [
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
staticassets-rs = { path = "../staticassets-rs" }
browserhost-rs = { path = "../browserhost-rs" }
keybindingrules-rs = { path = "../keybindingrules-rs" }
profilestats-rs = { path = "../profilestats-rs" }
profilestatsarchive-rs = { path = "../profilestatsarchive-rs" }
recapstats-rs = { path = "../recapstats-rs" }
usageanalyticsstats-rs = { path = "../usageanalyticsstats-rs" }
hostusage-rs = { path = "../hostusage-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.26"
http = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
flate2 = "1"
base64 = "0.22"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
portable-pty = "0.9"
sha1 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
x509-parser = "0.16"
time = "0.3"
p256 = { version = "0.13", features = ["pkcs8", "pem", "ecdsa", "ecdh"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-pemfile = "2"
synara-shellenv = { path = "../shellenv" }

[workspace]
