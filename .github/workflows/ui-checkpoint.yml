name: Native navigation candidate
on:
  push:
    branches: [astra/gpui-clean-rewrite]
    paths: [.github/workflows/ui-checkpoint.yml, scripts/prepare_native_navigation.py]
permissions:
  contents: read
concurrency:
  group: native-ui-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/gpui-clean-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1000
          persist-credentials: false
      - name: Assemble checksum-checked native source
        run: python3 scripts/prepare_native_navigation.py
      - name: Install repository toolchain and native libraries
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil python3-yaml fonts-dejavu-core
      - name: Format and validate the exact candidate
        id: verify
        run: |
          set -euo pipefail
          cargo +1.98.1 fmt -p synara-app
          git add -- crates/synara-app/src scripts/native_navigation_smoke.py scripts/prepare_native_navigation.py docs/ui/native-navigation.md ROADMAP.md .github/workflows/ui-checkpoint.yml .github/workflows/native.yml
          git diff --cached --check
          git diff --cached --stat
          git write-tree > "$RUNNER_TEMP/ui-evidence/tested-tree.txt"
          git diff --cached --binary > "$RUNNER_TEMP/ui-evidence/source.patch"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ui-evidence/checks.log"
          import json, os, pathlib, shlex, subprocess, yaml
          with open('.github/workflows/native.yml') as f:
              native = yaml.safe_load(f)
          assert any(s.get('name') == 'Native navigation and backend interaction smoke' for s in native['jobs']['linux']['steps'])
          checks = [
              'cargo +1.98.1 fmt --check',
              'cargo +1.98.1 check --quiet --locked --workspace',
              'cargo +1.98.1 clippy --quiet --locked --workspace --all-targets --all-features -- -D warnings',
              'cargo +1.98.1 test --quiet --locked --workspace',
              'python3 scripts/audit_workspace.py',
              'python3 scripts/check_roadmap.py --self-test',
              'python3 scripts/check_roadmap.py',
              'python3 scripts/test_audit_workspace.py',
              'python3 scripts/test_apply_source.py',
              'cargo +1.98.1 build --quiet --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture',
          ]
          results = []
          for command in checks:
              print('CHECK: ' + command, flush=True)
              completed = subprocess.run(shlex.split(command))
              results.append({'command': command, 'exit_code': completed.returncode})
              pathlib.Path(os.environ['RUNNER_TEMP'], 'ui-evidence', 'checks.json').write_text(json.dumps(results, indent=2) + '\n')
              if completed.returncode:
                  raise SystemExit(completed.returncode)
          PY
      - name: Existing native desktop contract
        id: desktop
        if: success()
        timeout-minutes: 4
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "$RUNNER_TEMP/ui-evidence/desktop"
      - name: Native navigation and backend contract
        id: navigation
        if: always() && steps.verify.outcome == 'success'
        timeout-minutes: 4
        run: python3 scripts/native_navigation_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "$RUNNER_TEMP/ui-evidence/navigation"
      - name: Preserve exact candidate objects for review without moving a ref
        if: always() && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RESULT: ${{ steps.desktop.outcome }}
          NAVIGATION_RESULT: ${{ steps.navigation.outcome }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ui-evidence'
          tested = (root / 'tested-tree.txt').read_text().strip()
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == tested
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          checks = json.loads((root / 'checks.json').read_text())
          assert len(checks) == 10 and all(c['exit_code'] == 0 for c in checks)
          receipt = {'parent': os.environ['GITHUB_SHA'], 'tested_source_tree': tested,
                     'run': 'https://github.com/cmdr-chara/synara/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                     'platform': 'Linux/X11/Xvfb', 'visual_comparison': 'not yet inspected',
                     'verification': checks, 'native_smoke': {}, 'screenshots': []}
          for name in ('desktop', 'navigation'):
              path = root / name / 'result.json'
              receipt['native_smoke'][name] = json.loads(path.read_text()) if path.exists() else {'status': 'missing'}
          accepted = all(r.get('status') == 'passed' for r in receipt['native_smoke'].values())
          accepted = accepted and os.environ['DESKTOP_RESULT'] == 'success' and os.environ['NAVIGATION_RESULT'] == 'success'
          receipt['interaction_gate'] = 'passed' if accepted else 'failed'
          for name in ('navigation-initial', 'tools-open', 'navigation-960', 'failure'):
              image = root / 'navigation' / (name + '.png')
              if image.exists():
                  assert image.stat().st_size < 2 * 1024 * 1024
                  target = pathlib.Path('docs/ui/captures') / image.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(image.read_bytes())
                  receipt['screenshots'].append({'path': str(target), 'sha256': hashlib.sha256(image.read_bytes()).hexdigest()})
          destination = pathlib.Path('docs/ui/native-navigation-evidence.json')
          assert not destination.exists()
          destination.write_text(json.dumps(receipt, indent=2) + '\n')
          subprocess.run(['git', 'add', str(destination)], check=True)
          if receipt['screenshots']:
              subprocess.run(['git', 'add', 'docs/ui/captures'], check=True)
          allowed = {'.github/workflows/ui-checkpoint.yml', '.github/workflows/native.yml', 'ROADMAP.md',
              'crates/synara-app/src/main.rs', 'crates/synara-app/src/shell.rs', 'crates/synara-app/src/input.rs',
              'crates/synara-app/src/ui.rs', 'crates/synara-app/src/shell/conversation.rs',
              'crates/synara-app/src/shell/navigation.rs', 'crates/synara-app/src/shell/chrome.rs',
              'scripts/prepare_native_navigation.py', 'scripts/native_navigation_smoke.py',
              'docs/ui/native-navigation.md', str(destination)}
          allowed.update(image['path'] for image in receipt['screenshots'])
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(changed) <= allowed
          def api(route, body=None):
              request = urllib.request.Request('https://api.github.com/repos/cmdr-chara/synara/' + route,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'Synara-native-verification', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in changed:
              path = pathlib.Path(name)
              sha = None
              if path.exists():
                  data = path.read_bytes()
                  assert len(data) < 2 * 1024 * 1024
                  sha = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          parent = os.environ['GITHUB_SHA']
          base = api('git/commits/' + parent)['tree']['sha']
          tree = api('git/trees', {'base_tree': base, 'tree': entries})['sha']
          assert tree == subprocess.check_output(['git', 'write-tree'], text=True).strip()
          message = 'feat(ui): native navigation and backend interaction checkpoint' if accepted else 'wip(ui): preserve native navigation candidate for diagnosis'
          commit = api('git/commits', {'message': message, 'tree': tree, 'parents': [parent]})
          output = {'candidate': commit['sha'], 'tree': tree, 'parent': parent, 'ref_updated': False,
                    'interaction_gate': receipt['interaction_gate'], 'visual_parity': 'not claimed'}
          (root / 'candidate.json').write_text(json.dumps(output, indent=2) + '\n')
          print(json.dumps(output, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ui-checkpoint
          retention-days: 7
          path: |
            ${{ runner.temp }}/ui-evidence/*.json
            ${{ runner.temp }}/ui-evidence/*.txt
            ${{ runner.temp }}/ui-evidence/*.log
            ${{ runner.temp }}/ui-evidence/*.patch
            ${{ runner.temp }}/ui-evidence/*/*.png
            ${{ runner.temp }}/ui-evidence/*/result.json
          if-no-files-found: warn
