name: Apply DeepSeek contract patch

on:
  push:
    branches:
      - agent/deepseek-harness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply guarded replacements
        run: node scripts/apply-deepseek-contract-patch.mjs
      - name: Format DeepSeek changes
        run: >-
          bunx oxfmt
          .github/workflows/apply-deepseek-contract-patch.yml
          scripts/apply-deepseek-contract-patch.mjs
          apps/server/src/provider/Layers/DeepSeekAdapter.ts
          apps/server/src/provider/acp/DeepSeekAcpSupport.ts
          apps/server/src/provider/Services/DeepSeekAdapter.ts
          apps/server/src/provider/Layers/ProviderAdapterRegistry.ts
          apps/server/src/provider/runtimeLayer.ts
          packages/contracts/src/orchestration.ts
          packages/contracts/src/model.ts
          packages/shared/src/providerMetadata.ts
      - name: Commit generated contract wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-deepseek-contract-patch.yml scripts/apply-deepseek-contract-patch.mjs apps/server/src/provider packages/contracts/src packages/shared/src/providerMetadata.ts
          git commit -m "Format DeepSeek provider integration"
          git push
