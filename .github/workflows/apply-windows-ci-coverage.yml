name: Apply permanent Windows runtime coverage

on:
  push:
    branches: [refactor/windows-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Expand the existing Windows regression job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          source = path.read_text()
          before = '''      - name: Test Windows process planning
                  run: bun run --cwd packages/shared test src/windowsProcess.test.ts

                - name: Test Effect Windows process spawn
                  run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts
          '''
          after = '''      - name: Test Windows executable and process runtime
                  run: |
                    bun run --cwd packages/shared test src/windowsProcess.test.ts src/platformProcess.test.ts src/processRuntime.test.ts

                - name: Test provider startup and process-tree lifecycle
                  run: |
                    bun run --cwd apps/server test src/windowsProcessEffect.test.ts src/processRunner.test.ts src/platform/processBoundary.test.ts src/provider/providerStartupLifecycle.test.ts src/provider/providerStartupLifecycle.integration.test.ts src/provider/supervisedProcessTeardown.test.ts src/terminal/processTreeKiller.test.ts src/terminal/windowsProcessSnapshot.test.ts
          '''
          if source.count(before) != 1:
              raise SystemExit("Expected Windows CI process block was not found")
          path.write_text(source.replace(before, after, 1))
          PY
      - name: Format and commit
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run fmt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps packages .docs
          git diff --cached --quiet && { echo "No CI changes produced"; exit 1; }
          git commit -m "ci(windows): cover runtime and provider lifecycle"
          git push origin HEAD
