name: Validated parity batch publication
on:
  push:
    branches: [astra/gpui-clean-rewrite]
    paths: ['.github/workflows/parity-batch.yml']
permissions:
  contents: write
concurrency:
  group: parity-batch-publication
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply reviewed batch with synchronized native search hit targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity-evidence
          git diff --exit-code 49e10568174783b0cacea0da9912fa10d8b73ab2 HEAD -- . ':!.github/workflows/parity-batch.yml'
          : > /tmp/parity-candidate.xz
          for blob in 6a2368245e12a8c8d00c85456b4f4d0719a084a9 2fad24429dde858aa20664b0533360397d821414 cca81f7da85c929a0192d6b3dfce55896bc54414 e19de9da3ae03b7376561b8042c455c651763e98; do
            gh api "repos/cmdr-chara/synara/git/blobs/$blob" --jq .content | tr -d '\n' | base64 -d >> /tmp/parity-candidate.xz
          done
          echo 'd9922f3a28e09b567a6f446533fb44e111cb1d1e190bdc75e8c6d21af9b4b1f7  /tmp/parity-candidate.xz' | sha256sum -c -
          xz -dc /tmp/parity-candidate.xz > /tmp/parity-candidate.patch
          test "$(wc -c < /tmp/parity-candidate.patch)" -eq 67410
          git apply --check /tmp/parity-candidate.patch
          git apply --index /tmp/parity-candidate.patch
          gh api repos/cmdr-chara/synara/git/blobs/7c344e32fb2c501a9e1237323ffaa6a6369c5b3b --jq .content | tr -d '\n' | base64 -d > /tmp/import-correction.patch
          git apply --check /tmp/import-correction.patch
          git apply --index /tmp/import-correction.patch
          gh api repos/cmdr-chara/synara/git/blobs/8ee4426071d803740ba276c2cfb9e9266515c579 --jq .content | tr -d '\n' | base64 -d > /tmp/native-signature.patch
          git apply --check /tmp/native-signature.patch
          git apply --index /tmp/native-signature.patch
          gh api repos/cmdr-chara/synara/git/blobs/7bb3f58f34f48413aaa597f7e29ee0324c4fc9f7 --jq .content | tr -d '\n' | base64 -d > /tmp/native-bounds.patch
          git apply --check /tmp/native-bounds.patch
          git apply --index /tmp/native-bounds.patch
          git diff --cached --name-only | sort > /tmp/parity-evidence/candidate-paths.txt
      - name: Install pinned build and native fixture prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update > /tmp/parity-evidence/install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation >> /tmp/parity-evidence/install.log 2>&1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parity-continuation-1.98.1-Linux-${{ github.sha }}
          restore-keys: |
            parity-continuation-1.98.1-Linux-
      - name: Formatting and exact reuse of passing Rust checks
        run: |
          set -euo pipefail
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all --check
          git diff --check
          git diff --cached --check
          git add -- crates Cargo.toml Cargo.lock rust-toolchain.toml
          git ls-files -s -- crates Cargo.toml Cargo.lock rust-toolchain.toml > /tmp/parity-evidence/validated-rust-index.txt
          echo '8781418c3021cb6113b41acbed4a91a09ca5a11ecae37f21452607458283af57  /tmp/parity-evidence/validated-rust-index.txt' | sha256sum -c -
          python3 scripts/check_roadmap.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('scripts/native_live_search_smoke.py').read_text())
          PY
          echo 'Run 36004763291 passed 129 app tests, 30 server library tests, one server binary test and 12 browser tests. Strict Clippy/all-target compilation passed after removing an unused import in run 36005707815. Product source/manifests are byte-identical to that passing candidate. Only Python helper invocation and fresh-layout synchronization are corrected here.' > /tmp/parity-evidence/reused-validation.txt
      - name: Native live search and narrow result selection journey
        run: |
          set -euo pipefail
          cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture 2>&1 | tee /tmp/parity-evidence/build.log
          python3 scripts/native_live_search_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/parity-evidence/live-search 2>&1 | tee /tmp/parity-evidence/native-journey.log
      - name: Prepare validated objects for explicit connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          receipt = Path('docs/verification/parity-2026-09-24-batch6.md')
          with receipt.open('a') as f:
              f.write('\n## Observed validation\n\n129 app tests, 30 server library tests, one server binary test and 12 browser tests passed in run 36004763291. After removing one unused test-only import, strict Clippy/all-target compilation passed in run 36005707815. Rust source/manifests are byte-identical to that passing candidate, verified by Git-index manifest SHA-256 `8781418c3021cb6113b41acbed4a91a09ca5a11ecae37f21452607458283af57`.\n')
              f.write('The first native attempt stopped in the Python launcher before opening an app because it called Scenario with the wrong signature. The corrected options-object invocation uses the unchanged fixture helper. A second native run passed live content-search/click checks and reached Ctrl+P, whose layout changed while the test still held old query bounds. The final test waits for a fresh rendered query bound before clicking. The native search journey, formatting and roadmap checks passed before these objects were prepared.\n')
              f.write('Evidence: https://github.com/cmdr-chara/synara/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n')
              f.write('Run attempt: ' + os.environ['GITHUB_RUN_ATTEMPT'] + '. Publication base: `' + os.environ['GITHUB_SHA'] + '`.\n')
              f.write('Native Linux/X11 evidence covers live name/content results, narrow-pane pointer selection, exact editor contents, query replacement, Escape cancellation and unchanged files/events. The web evidence uses the real InteractionBroker/API and deterministic DOM fixtures, not a live authenticated provider or remote deployment. SSH GUI and other-platform acceptance remain open.\n')
          PY
          python3 scripts/check_roadmap.py
          git diff --check
          git diff --name-only HEAD | sort > /tmp/parity-evidence/final-paths.txt
          diff -u /tmp/parity-evidence/candidate-paths.txt /tmp/parity-evidence/final-paths.txt
          while IFS= read -r path; do git add -- "$path"; done < /tmp/parity-evidence/candidate-paths.txt
          git diff --cached --check
          git diff --cached --binary > /tmp/parity-evidence/validated.patch
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          entries = []
          for path in Path('/tmp/parity-evidence/candidate-paths.txt').read_text().splitlines():
              mode, expected, stage = git('ls-files', '-s', '--', path).split('\t')[0].split()
              assert mode in ('100644', '100755') and stage == '0'
              data = Path(path).read_bytes()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/cmdr-chara/synara/git/blobs', '--input', '-'], input=body, text=True, capture_output=True, check=True)
              sha = json.loads(result.stdout)['sha']
              assert sha == expected, (path, sha, expected)
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          manifest = {'base_commit': git('rev-parse', 'HEAD'), 'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree_elements': entries, 'validated_patch_sha256': hashlib.sha256(Path('/tmp/parity-evidence/validated.patch').read_bytes()).hexdigest()}
          Path('/tmp/parity-evidence/publication.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          # Only blob objects are prepared. The branch is not moved by this job.
          # Final tree, commit and ordinary ref update are explicit connector actions.
      - name: Preserve exact candidate and validation evidence
        if: always()
        run: |
          mkdir -p /tmp/parity-evidence
          git diff --binary HEAD > /tmp/parity-evidence/remaining-candidate.patch
          git status --short > /tmp/parity-evidence/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parity-batch-evidence
          path: /tmp/parity-evidence/
          retention-days: 7
          if-no-files-found: error
