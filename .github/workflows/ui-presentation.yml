name: Focused native presentation
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record source and validate scope
        run: |
          mkdir -p /tmp/ui-source
          git rev-parse HEAD | tee /tmp/ui-source/revision.txt
          python3 scripts/test_native_ui_scope.py
          python3 scripts/check_roadmap.py
          python3 -m py_compile scripts/native_kanban_smoke.py
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Native system libraries
        run: |
          sudo apt-get update > /tmp/native-install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation >> /tmp/native-install.log 2>&1
      - name: Prepare the exact-context source candidate when present
        id: prepare
        run: |
          if test -f scripts/prepare_kanban_checkpoint.py; then
            python3 scripts/prepare_kanban_checkpoint.py
            cargo +1.98.1 fmt -p synara-app -p synara-workspace
            rm scripts/prepare_kanban_checkpoint.py
            echo 'prepared=true' >> "$GITHUB_OUTPUT"
          fi
          git diff --check
      - name: Changed-package formatting
        run: cargo +1.98.1 fmt --check -p synara-app -p synara-workspace
      - name: Atomic task creation and existing draft regressions
        run: |
          cargo +1.98.1 test --locked -p synara-workspace --lib storage::task_creation::tests > /tmp/ui-source/task-tests.log 2>&1 || { tail -100 /tmp/ui-source/task-tests.log; exit 1; }
          cargo +1.98.1 test --locked -p synara-workspace --lib storage::chat_preferences::tests >> /tmp/ui-source/task-tests.log 2>&1 || { tail -100 /tmp/ui-source/task-tests.log; exit 1; }
          cargo +1.98.1 test --locked -p synara-workspace --lib create >> /tmp/ui-source/task-tests.log 2>&1 || { tail -100 /tmp/ui-source/task-tests.log; exit 1; }
          tail -55 /tmp/ui-source/task-tests.log
      - name: Native board, menu, drafts and close regressions
        run: |
          for filter in shell::kanban::tests ui::menu::tests shell::drafts::tests close::tests; do
            cargo +1.98.1 test --locked -p synara-app --bin synara-app "$filter" >> /tmp/ui-source/app-tests.log 2>&1 || { tail -100 /tmp/ui-source/app-tests.log; exit 1; }
          done
          tail -60 /tmp/ui-source/app-tests.log
      - name: Strict changed-package lints
        run: |
          cargo +1.98.1 clippy --locked --no-deps -p synara-app -p synara-workspace --all-targets -- -D warnings > /tmp/ui-source/clippy.log 2>&1 || { tail -100 /tmp/ui-source/clippy.log; exit 1; }
      - name: Build native application and fixture
        id: build
        run: |
          cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture > /tmp/ui-source/build.log 2>&1 || { tail -100 /tmp/ui-source/build.log; exit 1; }
      - name: Native Kanban create, draft, run, stop and restart
        timeout-minutes: 4
        run: python3 scripts/native_kanban_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-kanban
      - name: Existing chat creation and Studio restoration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_studio_settings_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-studio
      - name: Existing native input and guarded close
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/ui-close
      - name: Export the tested source package without writing GitHub
        if: ${{ success() && steps.prepare.outputs.prepared == 'true' }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          from pathlib import Path
          allowed = {
            'crates/synara-app/src/shell.rs', 'crates/synara-app/src/shell/chrome.rs',
            'crates/synara-app/src/shell/kanban.rs', 'crates/synara-app/src/shell/overview.rs',
            'crates/synara-app/src/ui.rs', 'crates/synara-app/src/ui/task_dialog.rs',
            'crates/synara-workspace/src/service.rs', 'crates/synara-workspace/src/storage.rs',
            'crates/synara-workspace/src/storage/task_creation.rs', 'scripts/prepare_kanban_checkpoint.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().rstrip('\0').split('\0'))
          assert changed and changed <= allowed, changed - allowed
          subprocess.run(['git', 'add', '-u', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          data = subprocess.check_output(['git', 'diff', '--cached', '--no-ext-diff'])
          package = dict(base_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              mode='diff', gzip_base64=base64.b64encode(gzip.compress(data, mtime=0)).decode(),
              sha256=hashlib.sha256(data).hexdigest(),
              expected_tree=subprocess.check_output(['git', 'write-tree']).decode().strip(),
              message='feat(ui): integrate verified native Kanban task creation and lifecycle')
          Path('/tmp/ui-source/source-package.json').write_text(json.dumps(package))
          Path('/tmp/ui-source/candidate.patch').write_bytes(data)
          print('SOURCE_PACKAGE=' + json.dumps(package))
          PY
      - name: Check published candidates have no source mutations
        if: ${{ success() && steps.prepare.outputs.prepared != 'true' }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: focused-native-kanban
          path: |
            /tmp/ui-*/*.png
            /tmp/ui-*/*.log
            /tmp/ui-*/result.json
            /tmp/ui-source/
          retention-days: 7
          if-no-files-found: warn
