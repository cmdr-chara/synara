[package]
name = "synara-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Synara desktop shell: gpui-kit (gpui-fast) window embedding the web UI via a native webview while the UI is rebuilt natively"
license = "MIT"

[dependencies]
gpui-kit = { version = "0.10", features = ["gpui-fast", "tree-sitter", "tree-sitter-languages"] }
gpui-webview = { version = "0.10", features = ["gpui-fast"] }
wry = { version = "0.53.3", package = "lb-wry" }
anyhow = "1"
serde_json = "1"
tungstenite = "0.26"
ureq = { version = "2", features = ["json"] }
http = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-channel = "2"
urlencoding = "2"

[workspace]
