name: Recover pending source (not verification)
on:
  push:
    branches: [astra/gpui-clean-rewrite]
permissions:
  contents: write
jobs:
  recover-source-only:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Decode saved source as data and retain review objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request, zlib
          base = 'ec1c946b7959738e46e38aab2decfd4c226cb47c'
          root = pathlib.Path.cwd()
          parts = [root / 'docs/ui/.batch-recovery' / f'part-{n:04}.txt' for n in (1, 2)]
          expected = ['b6128ca672fffc2afa5173621bd12630d6a2d763', 'b8ade3763b8d26077d82bda8e6a0d67d04fc7a75']
          texts = []
          for path, sha in zip(parts, expected):
              data = path.read_bytes()
              assert len(data) < 100000
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              texts.append(data.decode('ascii').strip())
          encoded = ''.join(texts)
          data = base64.b64decode(encoded + '=' * (-len(encoded) % 4), validate=True)
          stream = zlib.decompressobj(31)
          raw = stream.decompress(data, 2000001)
          assert len(raw) <= 2000000 and not stream.unconsumed_tail
          text = raw.decode('utf-8', errors='replace')
          print('Compressed stream complete:', stream.eof)
          print('Decoded bytes:', len(raw), 'SHA256:', hashlib.sha256(raw).hexdigest())
          print('Payload prefix:', repr(text[:150]))
          work = pathlib.Path('/tmp/recovered-chat-source')
          subprocess.run(['git', 'worktree', 'add', '--detach', str(work), base], check=True)
          def git(*args, **kw):
              return subprocess.check_output(['git', '-C', str(work), *args], **kw)
          def allowed(path):
              return bool(re.fullmatch(r'[A-Za-z0-9_./-]+', path)) and '..' not in pathlib.PurePosixPath(path).parts and (
                  path.startswith(('crates/synara-app/src/', 'crates/synara-workspace/src/', 'scripts/native_', 'scripts/test_native_', 'docs/ui/')) or path == 'ROADMAP.md')
          recovered = []
          if text.startswith('diff --git '):
              for chunk in re.split(r'(?m)(?=^diff --git )', text):
                  if not chunk:
                      continue
                  header = re.match(r'diff --git a/(\S+) b/(\S+)\n', chunk)
                  if not header or header[1] != header[2] or not allowed(header[1]):
                      print('Excluded unapproved or noncanonical patch header:', repr(chunk[:120]))
                      continue
                  path = header[1]
                  if 'GIT binary patch' in chunk or re.search(r'(?m)^(new file mode|new mode) (?!100644|100755)', chunk):
                      raise SystemExit('Non-text entry')
                  check = subprocess.run(['git', '-C', str(work), 'apply', '--index', '--check', '-'], input=chunk.encode(), capture_output=True)
                  if check.returncode:
                      print('Incomplete/nonapplicable patch:', path, check.stderr.decode()[:500])
                      continue
                  subprocess.run(['git', '-C', str(work), 'apply', '--index', '-'], input=chunk.encode(), check=True)
                  recovered.append(path)
          elif text.lstrip().startswith('{'):
              decoder = json.JSONDecoder()
              position = text.index('{') + 1
              while True:
                  while position < len(text) and text[position] in ' \r\n\t,':
                      position += 1
                  if position >= len(text) or text[position] == '}':
                      break
                  try:
                      name, position = decoder.raw_decode(text, position)
                      while text[position].isspace(): position += 1
                      assert text[position] == ':'
                      position += 1
                      while text[position].isspace(): position += 1
                      content, position = decoder.raw_decode(text, position)
                  except (ValueError, IndexError):
                      print('Partial final JSON entry, retained complete preceding entries only')
                      break
                  assert allowed(name) and isinstance(content, str) and '\0' not in content and len(content.encode()) < 500000
                  target = work / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding='utf-8', newline='')
                  recovered.append(name)
          else:
              raise SystemExit('Unknown payload format, nothing executed or published')
          assert 1 <= len(recovered) <= 50
          subprocess.run(['git', '-C', str(work), 'add', '--', *recovered], check=True)
          print(git('diff', '--cached', '--stat').decode())
          def api(path, payload):
              request = urllib.request.Request('https://api.github.com/repos/cmdr-chara/synara/git/' + path,
                  data=json.dumps(payload).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for name in recovered:
              target = work / name
              if target.exists():
                  content = target.read_text(encoding='utf-8')
                  blob = api('blobs', {'content': content, 'encoding': 'utf-8'})['sha']
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob})
                  print('RECOVERED', name, blob, len(content), 'bytes')
              else:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('trees', {'base_tree': 'f5cb6d7b849a5c7e3723c4d5b791a9edca7f8958', 'tree': entries})['sha']
          commit = api('commits', {'message': 'Recovered pending chat utility source for review, untested', 'tree': tree, 'parents': [base]})['sha']
          print('REVIEW_TREE', tree)
          print('REVIEW_COMMIT', commit)
          print('No branch ref updated. No recovered code, build or test executed.')
          PY
