name: Electron parity candidate
on:
  push:
    branches: [astra/electron-main-parity]
    paths:
      - .github/workflows/electron-parity-candidate.yml
      - scripts/parity/apply_settings_parity.py
      - scripts/native_electron_parity_smoke.py
      - crates/synara-app/src/ui/metrics.rs
      - crates/synara-app/src/shell/settings/navigation.rs
      - crates/synara-app/src/shell/settings/desktop.rs
permissions:
  contents: read
concurrency:
  group: electron-parity-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/electron-main-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Apply the exact reviewed native source delta
        run: |
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('parity_delta', 'scripts/parity/apply_settings_parity.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          changes = module.prepare(Path.cwd().resolve())
          name = 'crates/synara-app/src/shell/settings.rs'
          changes[name] = module.replace(changes[name], '.id("settings-view")', '.id("settings-view").relative().child(ui::layout_probe_slot("settings-page", self.settings.section as usize))')
          for name, text in changes.items():
              Path(name).write_text(text, encoding='utf-8', newline='')
          print('\n'.join(sorted(changes)))
          PY
      - name: Install the documented native toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation x11-utils imagemagick
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: electron-parity-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            electron-parity-${{ runner.os }}-
            native-conversation-${{ runner.os }}-
            feature-closure-2-1.98.1-${{ runner.os }}-
      - name: Format only the changed Rust sources and new modules
        run: |
          mapfile -t changed < <(git diff --name-only -- '*.rs')
          rustfmt +1.98.1 --edition 2024 --config skip_children=true "${changed[@]}" crates/synara-app/src/ui/metrics.rs crates/synara-app/src/shell/settings/navigation.rs
          git diff --check
          python3 scripts/check_roadmap.py
          python3 -m unittest discover -s scripts -p 'test_native_ui_scope.py'
          python3 -m py_compile scripts/native_electron_parity_smoke.py scripts/parity/apply_settings_parity.py
          git diff --stat
      - name: Accumulated workspace tests
        run: |
          mkdir -p /tmp/electron-parity-evidence
          set -o pipefail
          cargo +1.98.1 test --locked --workspace --exclude synara-app 2>&1 | tee /tmp/electron-parity-evidence/workspace-tests.log
          cargo +1.98.1 test --locked -p synara-app 2>&1 | tee /tmp/electron-parity-evidence/app-tests.log
          cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture 2>&1 | tee /tmp/electron-parity-evidence/build.log
      - name: Capture all primary Settings pages and exercise existing owners
        run: |
          set -o pipefail
          python3 scripts/native_electron_parity_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/electron-parity-evidence/settings 2>&1 | tee /tmp/electron-parity-evidence/settings.log
      - name: Native interaction regression
        run: |
          set -o pipefail
          for journey in chat_behavior navigation model_draft appsnap handoff project_import direct_models integrations browser_webview stacked_prs rich_media task_split checkpoints goals recap pr_fix inline_comments releases; do
            python3 "scripts/native_${journey}_smoke.py" --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "/tmp/electron-parity-evidence/$journey" 2>&1 | tee "/tmp/electron-parity-evidence/$journey.log"
          done
      - name: Package the tested source delta
        run: |
          mkdir -p /tmp/electron-parity-candidate
          git diff --check
          git diff --binary > /tmp/electron-parity-candidate/candidate.patch
          git rev-parse HEAD > /tmp/electron-parity-candidate/base.txt
          git diff --name-only > /tmp/electron-parity-candidate/paths.txt
          cd /tmp/electron-parity-candidate
          sha256sum candidate.patch base.txt paths.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: electron-parity-tested-source
          path: /tmp/electron-parity-candidate/
          retention-days: 7
      - name: Record candidate identity
        if: always()
        run: |
          mkdir -p /tmp/electron-parity-evidence
          git rev-parse HEAD > /tmp/electron-parity-evidence/base-revision.txt
          git diff --stat > /tmp/electron-parity-evidence/source-stat.txt
          git diff --binary > /tmp/electron-parity-evidence/candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: electron-parity-native-evidence
          path: /tmp/electron-parity-evidence/
          retention-days: 7
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: electron-parity-${{ runner.os }}-${{ github.sha }}
  publish:
    needs: verify
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/electron-main-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: electron-parity-tested-source
          path: /tmp/electron-parity-candidate
      - name: Publish only the tested allowlisted native sources without force
        env:
          EXPECTED_BASE: ${{ github.sha }}
        run: |
          cd /tmp/electron-parity-candidate
          sha256sum -c SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          test "$(cat /tmp/electron-parity-candidate/base.txt)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/astra/electron-main-parity | cut -f1)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {
              'crates/synara-app/src/ui.rs',
              'crates/synara-app/src/ui/personalization.rs',
              'crates/synara-app/src/ui/metrics.rs',
              'crates/synara-app/src/shell/settings.rs',
              'crates/synara-app/src/shell/settings/navigation.rs',
              'crates/synara-app/src/shell/settings/desktop.rs',
              'crates/synara-app/src/shell/appsnap.rs',
              'crates/synara-app/src/shell/review.rs',
              'crates/synara-app/src/shell/review/repository.rs',
              'crates/synara-app/src/shell/review/repository/view.rs',
              'crates/synara-workspace/src/settings.rs',
              'crates/synara-workspace/src/settings/personalization.rs',
          }
          patch = Path('/tmp/electron-parity-candidate/candidate.patch').read_bytes()
          if b'GIT binary patch' in patch or b'Binary files' in patch:
              raise SystemExit('Only reviewed UTF-8 native source deltas are allowed')
          stats = subprocess.check_output(['git', 'apply', '--numstat', '-z', '-'], input=patch)
          paths = set()
          for row in filter(None, stats.split(b'\0')):
              fields = row.split(b'\t', 2)
              if len(fields) != 3 or not fields[0].isdigit() or not fields[1].isdigit():
                  raise SystemExit('Renames and binary changes are not allowed')
              path = fields[2].decode('utf-8')
              if path not in allowed or Path(path).is_symlink():
                  raise SystemExit('Source delta escapes its reviewed native scope')
              paths.add(path)
          recorded = set(Path('/tmp/electron-parity-candidate/paths.txt').read_text().splitlines())
          if not paths or paths != recorded:
              raise SystemExit('Source manifest and delta disagree')
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', '-'], input=patch, check=True)
          PY
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(parity): integrate verified Electron typography and native Settings routing'
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/astra/electron-main-parity
          echo "Published tested source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
