name: Scoped Git backend formatting
on:
  push:
    branches: [main]
    paths:
      - 'crates/synara-workspace/src/git_operations/**'
      - '.github/workflows/backend-git-format.yml'
permissions:
  contents: read
concurrency:
  group: git-backend-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check the scoped backend module without changing main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = cmdr-chara/synara
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --max-parents=0 HEAD)" = d87e0672a193da01206aceb366b0d8353666c8cf
          rustfmt +1.98.1 --edition 2024 --check crates/synara-workspace/src/git_operations/mod.rs
          git diff --exit-code
          printf 'Checked candidate: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
