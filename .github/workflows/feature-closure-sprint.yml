name: Feature closure sprint
on:
  push:
    branches: [astra/feature-closure-sprint]
    paths:
      - .feature-closure-request.json
      - .github/workflows/feature-closure-sprint.yml
      - scripts/feature_closure_transfer.py
permissions:
  contents: read
concurrency:
  group: feature-closure-sprint
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      publication_sha256: ${{ steps.package.outputs.publication_sha256 }}
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Native Linux prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: feature-closure-1.98.1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            feature-closure-1.98.1-${{ runner.os }}-
            direct-conversations-1.98.1-${{ runner.os }}-
            max-feature-1.98.1-${{ runner.os }}-
      - name: Verify exact source transport and apply the scoped feature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, sys
          sys.path.insert(0, 'scripts')
          import feature_closure_transfer as transfer
          original = transfer.read_request
          def request():
              value = original()
              if value['patch_gzip_base64'] == ['.feature-closure-part-0000']:
                  path = Path('.feature-closure-part-0000')
                  assert not path.is_symlink() and 0 < path.stat().st_size <= transfer.LIMIT
                  data = path.read_bytes()
                  if data.startswith(b'diff --git '):
                      value['patch_gzip_base64'] = base64.b64encode(gzip.compress(data, mtime=0)).decode()
              return value
          transfer.read_request = request
          transfer.prepare()
          PY
      - name: Apply exact diagnosed release corrections before verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          repairs = [
              ('crates/synara-workspace/src/storage/releases.rs', '7145770c1085f54fbbb317bffd7531e4e0abb175f18984a3f1daa2648cefb5b5', '9260cefc93d37234c7dc23aa3dcf0771a3e5a48cf7a5d5e01fa427ec9e528f25', b'synara_core::now_ms()', b'crate::now_ms()'),
              ('scripts/native_releases_smoke.py', '93f70a69cefac833115122741c2aaa413a486b4e85b05cf1ff16f1047e8890c3', '4219d121151ffd5d7e0ae3eebcc4cabd03e07a21cab3505d64925b56a3a17777', b'resize(s, 800, 640)', b'resize(s.desktop, 800, 640)')
          ]
          for name, old_hash, new_hash, old, new in repairs:
              p = Path(name)
              before = p.read_bytes()
              digest = hashlib.sha256(before).hexdigest()
              if digest == old_hash:
                  after = before.replace(old, new)
                  assert hashlib.sha256(after).hexdigest() == new_hash
                  p.write_bytes(after)
                  subprocess.run(['git', 'add', '--', name], check=True)
              else:
                  assert digest == new_hash, 'Unexpected source; no repair applied: ' + name
          PY
      - name: Separate reviewed goal Send from navigation without bypassing editor guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, sys
          sys.path.insert(0, 'scripts')
          import feature_closure_transfer as transfer
          patch = Path('.feature-closure-part-0011')
          assert not patch.is_symlink() and patch.stat().st_size < 16384
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == '52f1be640349c6cefb38e872f232bea8fbb179bf910139cdc5289a4f14c8f26f'
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch)], check=True)
          (transfer.EVIDENCE / 'source-paths.json').write_text(json.dumps(transfer.changed_paths()))
          PY
      - name: Focused checks and native journeys
        run: python3 scripts/feature_closure_transfer.py check
      - name: Package exactly the checked tree
        id: package
        run: python3 scripts/feature_closure_transfer.py package
      - name: Preserve all results, including failed candidates
        if: always()
        run: |
          mkdir -p /tmp/feature-closure-evidence
          git rev-parse HEAD > /tmp/feature-closure-evidence/worktree-revision.txt
          git status --short > /tmp/feature-closure-evidence/status.txt
          git diff HEAD > /tmp/feature-closure-evidence/candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-closure-evidence
          path: /tmp/feature-closure-evidence/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: feature-closure-publication
          path: /tmp/feature-closure-publication/
          retention-days: 1
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: feature-closure-1.98.1-${{ runner.os }}-${{ github.sha }}
  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feature-closure-publication
          path: /tmp/feature-closure-publication/
      - name: Publish verified Git objects and non-force session ref only
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA256: ${{ needs.check.outputs.publication_sha256 }}
        run: python3 scripts/feature_closure_transfer.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feature-closure-published-ref
          path: /tmp/feature-closure-evidence/
          retention-days: 7
