name: Apply DeepSeek contract patch

on:
  push:
    branches:
      - agent/deepseek-harness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded replacements
        run: node scripts/apply-deepseek-contract-patch.mjs
      - name: Commit generated contract wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/orchestration.ts packages/contracts/src/model.ts
          git commit -m "Wire DeepSeek provider contracts"
          git push
