[package]
name = "synara-workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
jiff = "=0.2.37"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
synara-model = { path = "../synara-model" }
synara-browser = { path = "../synara-browser" }
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
url = "2.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
synara-registry = { path = "../synara-registry" }
synara-core = { path = "../synara-core" }
synara-runtime = { path = "../synara-runtime" }
synara-agent = { path = "../synara-agent" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks", "limits"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true

tempfile.workspace = true

[lints]
workspace = true
