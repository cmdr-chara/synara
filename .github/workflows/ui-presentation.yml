                      .flex().gap(px(2.)).p(px(6.)).border_b_1().border_color(rgb(palette().border)).overflow_x_scroll()
                      .children(entries.enumerate().map(|(slot,(tab,label,glyph))| {
                          let active=state.tab==tab; let tooltip=label.clone();
                          button_shell(SharedString::from(format!("source-{slot}")),label.clone(),active)
                              .role(gpui::Role::Tab).aria_label(label).aria_selected(active).size(px(28.)).p_0()
                              .relative().flex_shrink_0().flex().items_center().justify_center().bg(rgba(0))
                              .child(icon(glyph).size(px(16.)))
                              .child(layout_probe_slot("model-source",slot))
                              .children(active.then(||div().absolute().bottom(px(-3.)).left(px(6.)).right(px(6.)).h(px(2.)).rounded_full().bg(rgb(palette().focus))))
                              .tooltip(move|_,cx|cx.new(|_|Tooltip(tooltip.clone().into())).into())
                              .on_click(cx.listener(move|this,_,window,cx|{this.choose_source(tab,window,cx);cx.stop_propagation();}))
                      })).into_any_element()
              }
              pub(super) fn model_favorite_button(&self,index:usize,position:usize,cx:&mut Context<Self>) -> Option<gpui::AnyElement> {
                  let state=self.models.as_ref()?;
                  let favorite=state.rows.get(index)?.favorite.as_ref()?;
                  let starred=state.favorites.contains(favorite);
                  let unavailable=!state.ready || state.saving;
                  let label=format!("{} {}",if starred {"Unstar"} else {"Star"},self.choices[index].label);
