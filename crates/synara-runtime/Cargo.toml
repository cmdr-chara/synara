[package]
name = "synara-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"

[target.'cfg(unix)'.dependencies]
filedescriptor = "=0.8.3"
nix = { version = "0.30", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
rustix = { version = "=1.1.5", features = ["process", "event"] }

[target.'cfg(windows)'.dependencies]
win32job = "=2.0.3"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
