name: UI development inputs
on:
  push:
    branches: [astra/session-ui-overhaul]
    paths: [.github/workflows/ui-development-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ui-overhaul'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install software Vulkan renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Export software renderer and its non-system dependencies
        run: |
          mkdir -p /tmp/ui-vulkan/lib
          python3 - <<'PY'
          import pathlib, subprocess, shutil, re, json
          source = pathlib.Path('/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so')
          destination = pathlib.Path('/tmp/ui-vulkan/lib')
          excluded = re.compile(r'^(libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|ld-linux)')
          pending, seen = [source], set()
          while pending:
              path = pending.pop()
              if path.name in seen or excluded.match(path.name):
                  continue
              seen.add(path.name)
              shutil.copyfile(path.resolve(), destination / path.name)
              output = subprocess.check_output(['ldd', str(path)], text=True)
              for line in output.splitlines():
                  match = re.search(r'=> (/\S+)', line)
                  if match:
                      pending.append(pathlib.Path(match[1]))
          pathlib.Path('/tmp/ui-vulkan/lvp.json').write_text(json.dumps({'file_format_version':'1.0.0','ICD':{'library_path':'lib/libvulkan_lvp.so','api_version':'1.4.0'}}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-vulkan-runtime
          path: /tmp/ui-vulkan/
          retention-days: 1
