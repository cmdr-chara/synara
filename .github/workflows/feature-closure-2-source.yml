name: Feature closure 2 source transfer
on:
  push:
    branches: [astra/feature-closure-sprint-2]
    paths: ['.github/workflows/feature-closure-2-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot exact session source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/astra/feature-closure-sprint-2
          mkdir -p /tmp/feature-closure-2-source
          git bundle create /tmp/feature-closure-2-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/feature-closure-2-source/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feature-closure-2-source
          path: /tmp/feature-closure-2-source/
          retention-days: 1
