name: DeepSeek source review validation v2
on:
  push:
    branches:
      - tmp/deepseek-review-fixes
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/deepseek-review-fixes
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Apply source patch
        run: python3 scripts/deepseek-review-fixes-v2.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format touched files
        run: bunx oxfmt --write apps/server/src/provider/acp/DeepSeekAcpSupport.ts apps/server/src/provider/Layers/DeepSeekAdapter.ts apps/web/src/components/settings/ProvidersSettingsPanel.tsx apps/web/src/components/PluginLibrary.tsx
      - name: Focused DeepSeek tests
        run: bun run --cwd apps/server test -- src/provider/acp/DeepSeekAcpSupport.test.ts src/provider/Layers/DeepSeekProviderHealth.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Commit validated source tree
        run: |
          git rm scripts/deepseek-review-fixes.py scripts/deepseek-review-fixes-v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deepseek): address ACP review findings"
          git push origin HEAD:tmp/deepseek-review-fixes
