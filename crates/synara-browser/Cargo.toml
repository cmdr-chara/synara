[package]
name = "synara-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "=2.5.8"

[lints]
workspace = true

[features]
native-webview = ["dep:wry", "dep:raw-window-handle", "dep:gtk", "dep:gdkx11", "dep:x11rb", "dep:webkit2gtk", "dep:javascriptcore-rs", "dep:tempfile"]

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "=0.57.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
gtk = { version = "=0.18.2", optional = true }
gdkx11 = { version = "=0.18.2", optional = true }
x11rb = { version = "=0.13.2", optional = true }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"], optional = true }
javascriptcore-rs = { version = "=1.1.2", optional = true }
tempfile = { workspace = true, optional = true }
