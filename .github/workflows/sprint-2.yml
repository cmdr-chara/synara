name: Sprint 2 focused native validation
on:
  push:
    branches: [astra/max-feature-sprint-2]
    paths: [.github/workflows/sprint-2.yml, .synara-sprint-2.json]
permissions:
  contents: write
concurrency:
  group: synara-max-feature-sprint-2
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/max-feature-sprint-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: 1
      RUST_BACKTRACE: 0
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Pinned compiler and native prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sprint-2-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sprint-2-v1-${{ runner.os }}-
      - name: Validate exact bounded candidate and publish only the session branch
        run: |
          mkdir -p /tmp/sprint2-evidence
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/sprint2-evidence/validation.log
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          def run(*args, **kwargs):
              print('+', ' '.join(args), flush=True)
              return subprocess.run(args, check=True, **kwargs)
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          def allowed(path):
              return path in ('ROADMAP.md', 'README.md') or path.startswith(('crates/', 'docs/', 'scripts/native_sprint2', 'scripts/test_sprint2'))
          head = output('git', 'rev-parse', 'HEAD')
          main = output('git', 'ls-remote', 'origin', 'refs/heads/main')
          package_path = Path('.synara-sprint-2.json')
          package = None
          changed = []
          if package_path.exists():
              assert not package_path.is_symlink() and package_path.stat().st_size <= 4 * 1024 * 1024
              package = json.loads(package_path.read_text(encoding='utf-8'))
              assert re.fullmatch('[0-9a-f]{40}', package['base'])
              run('git', 'merge-base', '--is-ancestor', package['base'], head)
              preceding = output('git', 'diff', '--name-only', package['base'], head).splitlines()
              assert all(p in ('.github/workflows/sprint-2.yml', '.synara-sprint-2.json') for p in preceding), preceding
              patch = package['patch'].encode('utf-8')
              assert len(patch) <= 3 * 1024 * 1024
              assert hashlib.sha256(patch).hexdigest() == package['sha256']
              run('git', 'apply', '--check', '-', input=patch)
              run('git', 'apply', '-', input=patch)
              changed = output('git', 'ls-files', '--modified', '--others', '--exclude-standard').splitlines()
              assert changed and len(changed) <= 100 and all(allowed(p) for p in changed), changed
              assert all(not Path(p).is_symlink() for p in changed)
              rust = [p for p in changed if p.endswith('.rs') and Path(p).is_file()]
              if rust:
                  run('rustfmt', '+1.98.1', '--edition', '2024', '--config', 'skip_children=true', *rust)
              for crate, test in package.get('tests', []):
                  assert crate in ('synara-workspace', 'synara-app', 'synara-core', 'synara-runtime', 'synara-model')
                  assert re.fullmatch('[A-Za-z0-9_:]+', test)
                  target = ['--bin', 'synara-app'] if crate == 'synara-app' else ['--lib']
                  run('cargo', '+1.98.1', 'test', '--locked', '-p', crate, *target, test)
          run('cargo', '+1.98.1', 'build', '--locked', '-p', 'synara-app', '--bin', 'synara-app', '-p', 'synara-acp', '--bin', 'synara-acp-fixture')
          if package:
              for script in package.get('journeys', []):
                  assert re.fullmatch('native_[a-z0-9_]+_smoke[.]py', script)
                  assert Path('scripts', script).is_file()
                  run('python3', 'scripts/' + script, '--binary', 'target/debug/synara-app', '--fixture', 'target/debug/synara-acp-fixture', '--output', '/tmp/sprint2-evidence/' + script[:-3])
              run('python3', 'scripts/check_roadmap.py')
              run('git', 'diff', '--check')
              message = package['message']
              assert isinstance(message, str) and 1 <= len(message) <= 180 and '\n' not in message
              current = output('git', 'ls-remote', 'origin', 'refs/heads/astra/max-feature-sprint-2').split()[0]
              assert current == head, 'Session advanced concurrently; candidate is preserved, not force-pushed'
              assert output('git', 'ls-remote', 'origin', 'refs/heads/main') == main, 'Main changed concurrently; inspect before publishing'
              run('git', 'add', '--', *changed)
              run('git', 'config', 'user.name', 'Synara validation')
              run('git', 'config', 'user.email', 'synara-validation@users.noreply.github.com')
              run('git', 'commit', '-m', message)
              run('git', 'push', 'origin', 'HEAD:refs/heads/astra/max-feature-sprint-2')
          PY
      - name: Preserve candidate identity and evidence
        if: always()
        run: |
          mkdir -p /tmp/sprint2-evidence
          git rev-parse HEAD > /tmp/sprint2-evidence/revision.txt
          git status --short > /tmp/sprint2-evidence/status.txt
          git diff HEAD > /tmp/sprint2-evidence/candidate.patch
          git bundle create /tmp/sprint2-evidence/source.bundle HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sprint2-evidence
          path: /tmp/sprint2-evidence/
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sprint-2-v1-${{ runner.os }}-${{ github.sha }}
