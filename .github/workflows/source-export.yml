name: Source Export

on:
  push:
    branches:
      - agent/source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/upload-artifact@v4
        with:
          name: synara-source
          path: |
            .
            !.git
