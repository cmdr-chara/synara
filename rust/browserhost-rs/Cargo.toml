[package]
name = "browserhost-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Synara browser host: upstream-compatible unix-socket JSON-RPC host server, host client, and Chrome CDP driver"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
