name: SSH transport verification
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
  push:
    branches: [astra/session-ajm]
permissions:
  contents: read
concurrency:
  group: ssh-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.98.1'
jobs:
  loopback:
    if: github.repository == 'cmdr-chara/synara' && (github.event_name == 'workflow_call' || github.ref == 'refs/heads/astra/session-ajm')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.revision || github.sha }}
          persist-credentials: false
      - name: Record exact SSH candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/ajm-ssh-evidence
          git rev-parse HEAD > /tmp/ajm-ssh-evidence/revision.txt
      - name: Install pinned Rust, OpenSSH and native prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y openssh-client openssh-server clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation
          sudo install -d -m 0755 /run/sshd
      - name: Check fixture syntax
        run: python3 -m py_compile scripts/ssh_smoke.py scripts/remote_native_smoke.py
      - name: Build native SSH acceptance binaries
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Verify isolated SSH transport, managed worktrees, search and native UI
        run: |
          set -o pipefail
          { git rev-parse HEAD; python3 scripts/ssh_smoke.py --native-binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --native-output /tmp/ajm-ssh-evidence/native; } 2>&1 | tee /tmp/ajm-ssh-evidence/ssh.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ajm-ssh-evidence
          path: /tmp/ajm-ssh-evidence/
          retention-days: 7
          if-no-files-found: error
  ajm-linux:
    if: github.repository == 'cmdr-chara/synara' && github.ref == 'refs/heads/astra/session-ajm'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SMOKE_DIR: /tmp/synara-ajm-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      REMOTE_SMOKE_DIR: /tmp/synara-ajm-remote-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated lineage and preserve exact candidate
        run: |
          mkdir -p /tmp/ajm-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121 HEAD)" = 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121
          test "$(git rev-list --max-parents=0 HEAD)" = 43b1fb89bf19dadc388d18008f9ceb21b8215716
          test -z "$(git rev-list --min-parents=2 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121..HEAD)"
          test ! -e crates/synara-runtime/verification/ajm-checkpoint.json
          git rev-parse HEAD > /tmp/ajm-evidence/revision.txt
          git bundle create /tmp/ajm-evidence/source.bundle HEAD
          git diff --stat 1cd24dd6f5ac9571c1ea2b7329bcb5fc1a4ad121 HEAD > /tmp/ajm-evidence/changed-files.txt
      - name: Verify parallel write ownership
        run: |
          set -o pipefail
          { python3 crates/synara-runtime/verification/check_ajm_scope.py --self-test && python3 crates/synara-runtime/verification/check_ajm_scope.py; } 2>&1 | tee /tmp/ajm-evidence/scope.log
      - name: Install pinned Rust and native libraries
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil fonts-dejavu-core openssh-client openssh-server
          sudo install -d -m 0755 /run/sshd
          { rustc --version; cargo --version; uname -a; } > /tmp/ajm-evidence/environment.txt
      - name: Structural checks
        run: |
          set -o pipefail
          { python3 scripts/audit_workspace.py && python3 scripts/test_apply_source.py && python3 scripts/check_roadmap.py --self-test && python3 scripts/check_roadmap.py; } 2>&1 | tee /tmp/ajm-evidence/structure.log
      - name: Formatting
        if: always()
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee /tmp/ajm-evidence/fmt.log
      - name: Compile workspace
        if: always()
        run: |
          set -o pipefail
          cargo check --locked --workspace 2>&1 | tee /tmp/ajm-evidence/check.log
      - name: Lint all targets and features
        if: always()
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/ajm-evidence/clippy.log
      - name: Workspace regression tests
        if: always()
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee /tmp/ajm-evidence/test.log
      - name: Build native smoke binaries
        run: |
          set -o pipefail
          cargo build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture 2>&1 | tee /tmp/ajm-evidence/build.log
      - name: Isolated native desktop smoke
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output "$SMOKE_DIR" 2>&1 | tee /tmp/ajm-evidence/smoke.log
      - name: Isolated remote native desktop smoke
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 scripts/ssh_smoke.py --native-only --native-binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --native-output "$REMOTE_SMOKE_DIR" 2>&1 | tee /tmp/ajm-evidence/remote-smoke.log
      - name: Verify checks did not change tracked source
        if: always()
        run: |
          git status --porcelain=v1 > /tmp/ajm-evidence/worktree-status.txt
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ajm-linux-evidence
          path: |
            /tmp/ajm-evidence/
            ${{ env.SMOKE_DIR }}/*.png
            ${{ env.SMOKE_DIR }}/*.log
            ${{ env.SMOKE_DIR }}/result.json
            ${{ env.REMOTE_SMOKE_DIR }}/*.png
            ${{ env.REMOTE_SMOKE_DIR }}/*.log
            ${{ env.REMOTE_SMOKE_DIR }}/result.json
          retention-days: 7
          if-no-files-found: error
