name: Fix DeepSeek contract exhaustiveness

on:
  push:
    branches:
      - agent/deepseek-harness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply guarded replacements
        run: node scripts/fix-deepseek-contract-exhaustiveness.mjs
      - name: Format patched contracts
        run: >-
          bunx oxfmt
          packages/contracts/src/agentMentions.ts
          packages/contracts/src/model.ts
      - name: Commit contract fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/agentMentions.ts packages/contracts/src/model.ts
          git commit -m "Fix DeepSeek provider contract exhaustiveness"
          git push
