name: DeepSeek Provider Options Fix

on:
  push:
    branches:
      - agent/deepseek-harness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deepseek-harness
          fetch-depth: 0
      - name: Patch provider options expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/session-logic.test.ts")
          text = path.read_text()
          old = '''      { value: "grok", label: "Grok", available: true },
      { value: "droid", label: "Droid", available: true },'''
          new = '''      { value: "grok", label: "Grok", available: true },
      { value: "deepseek", label: "DeepSeek Harness", available: true },
      { value: "droid", label: "Droid", available: true },'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/session-logic.test.ts
          git commit -m "test(deepseek): update provider options expectation"
          git push origin HEAD:agent/deepseek-harness
