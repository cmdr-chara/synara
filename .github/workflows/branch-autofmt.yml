name: Branch Autoformat

on:
  push:
    branches:
      - "agent/**"
      - "fix/**"
      - "codex/**"
      - "cmdr-chara/**"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Apply requested patch and format
        run: |
          if [ -f .automation.patch ]; then
            git apply --whitespace=nowarn .automation.patch
            rm .automation.patch
          fi
          rm -f .automation-touch
          bun run fmt
      - name: Commit worker changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: apply automated branch patch"
          git push
