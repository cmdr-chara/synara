name: DeepSeek exhaustiveness fixer

on:
  push:
    branches:
      - agent/deepseek-harness

permissions:
  contents: write

jobs:
  fix-and-typecheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/deepseek-harness
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Apply DeepSeek integration edits
        run: node scripts/apply-deepseek-exhaustiveness.mjs

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile

      - name: Format touched source
        run: >-
          bunx oxfmt
          packages/contracts/src/model.ts
          packages/contracts/src/settings.ts
          apps/server/src/agentGateway/targetResolver.ts
          apps/web/src/appSettings.ts
          apps/web/src/components/ProviderIcon.tsx
          apps/web/src/components/PluginLibrary.tsx

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/model.ts packages/contracts/src/settings.ts apps/server/src/agentGateway/targetResolver.ts apps/web/src/appSettings.ts apps/web/src/components/ProviderIcon.tsx apps/web/src/components/PluginLibrary.tsx
          git commit -m "feat(deepseek): complete settings and provider exhaustiveness" || true
          git push origin HEAD:agent/deepseek-harness

      - name: Typecheck
        run: bun run typecheck
