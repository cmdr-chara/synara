name: CI

on:
  push:
    branches: [main, feat/rust-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (GPUI) — macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/shell
      - name: fmt
        run: cargo fmt --check
        working-directory: rust/shell
      - name: build
        run: cargo build --locked
        working-directory: rust/shell
      - name: test
        run: cargo test --locked
        working-directory: rust/shell
      - name: clippy (non-blocking)
        run: cargo clippy --locked -- -D warnings
        working-directory: rust/shell
        continue-on-error: true

  backend:
    name: Backend — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/app
      - name: fmt
        run: cargo fmt --check
        working-directory: rust/app
      - name: build
        run: cargo build --locked
        working-directory: rust/app
      - name: test
        run: cargo test --locked
        working-directory: rust/app
      - name: clippy (non-blocking)
        run: cargo clippy --locked -- -D warnings
        working-directory: rust/app
        continue-on-error: true

  native-helpers:
    name: Swift helpers — macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build appsnap helper
        run: node rust/native/scripts/build-appsnap-helper.mjs --arch arm64 --release --output rust/native/appsnap/build/synara-appsnap-helper
      - name: Build device helper
        run: bash rust/native/device-helper/build.sh
