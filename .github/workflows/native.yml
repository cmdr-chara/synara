name: Assemble feature batch (compile only)
on:
  push:
    branches: [astra/gpui-clean-rewrite]
permissions:
  contents: write
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  finish-chat-batch:
    if: github.repository == 'cmdr-chara/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 100
          persist-credentials: false
      - name: Complete reviewed module and persistence wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              assert text.count(old) == 1, (path, 'Unexpected source base')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='')
          storage = 'crates/synara-workspace/src/storage.rs'
          replace(storage, 'mod chat_preferences;\n', 'mod chat_preferences;\nmod conversation_tools;\npub use conversation_tools::{MessageAnchor, MessageSearch};\n')
          replace(storage, 'if let Some(id) = key.strip_prefix("task-draft:") {', 'if let Some(id) = key.strip_prefix("task-draft:").or_else(|| key.strip_prefix("message-pins:")) {')
          replace(storage, '"DELETE FROM preferences WHERE key=?1",\n            [format!("task-draft:{id}")],', '"DELETE FROM preferences WHERE key IN (?1,?2)",\n            params![format!("task-draft:{id}"), format!("message-pins:{id}")],')
          replace('crates/synara-app/src/shell/transcript.rs', 'use super::*;\nuse gpui::', 'mod search;\nuse super::*;\nuse gpui::')
          replace('crates/synara-app/src/shell/chat_tools.rs', 'fn snippet(text: &str) -> String {', 'fn role_label(role: Role) -> &\'static str {\n    match role { Role::User => "User", Role::Assistant => "Assistant", Role::Reasoning => "Reasoning" }\n}\nfn snippet(text: &str) -> String {')
          replace('ROADMAP.md', 'Local targeted storage/state tests pass. Exact-source native acceptance is recorded\nin the receipt after the combined candidate run, not inferred from compilation.', 'Regression tests are prepared but deferred until the batch is assembled, as requested.\nCompilation is tracked separately from native interaction acceptance in the receipt.')
          scope = 'scripts/native_ui_scope.py'
          extra = '''CHAT_TOOLS_ANCHORS = frozenset({
              'crates/synara-app/src/shell/chat_tools.rs',
              'crates/synara-workspace/src/storage/conversation_tools.rs',
              'crates/synara-app/src/shell/transcript/search.rs',
              'scripts/native_chat_tools_smoke.py',
          })
          CHAT_TOOLS_PATHS = UI_PATHS | ENVIRONMENT_PATHS | CHAT_TOOLS_ANCHORS | frozenset({
              'crates/synara-app/src/shell/activity.rs',
              'crates/synara-app/src/shell/conversation.rs',
              'crates/synara-app/src/shell/transcript.rs',
              '.github/workflows/ui-chat-tools.yml',
          })


          def chat_tools_only(paths):
              paths = set(paths)
              return bool(paths & CHAT_TOOLS_ANCHORS) and all(
                  path in CHAT_TOOLS_PATHS or documentation(path) for path in paths
              )


          '''
          replace(scope, 'def scope_for_paths(paths):', extra + 'def scope_for_paths(paths):')
          replace(scope, "    if environment_only(paths):\n        return 'environment'", "    if chat_tools_only(paths):\n        return 'chat-tools'\n    if environment_only(paths):\n        return 'environment'")
          tests = '''class ChatUtilityScopeTests(unittest.TestCase):
              def test_batched_chat_tools_select_one_coherent_lane(self):
                  self.assertEqual(scope_for_paths([
                      'crates/synara-app/src/shell/chat_tools.rs',
                      'crates/synara-workspace/src/storage/conversation_tools.rs',
                      'crates/synara-app/src/shell/transcript/search.rs',
                      'crates/synara-app/src/shell/environment.rs',
                      '.github/workflows/ui-chat-tools.yml',
                  ]), 'chat-tools')

              def test_unrelated_backend_or_dependency_changes_still_require_full_lane(self):
                  for path in ['Cargo.lock', 'crates/synara-agent/src/lib.rs', 'unknown.rs']:
                      self.assertEqual(scope_for_paths(['scripts/native_chat_tools_smoke.py', path]), 'full')


          '''
          replace('scripts/test_native_ui_scope.py', "if __name__ == '__main__':", tests + "if __name__ == '__main__':")
          Path('.github/workflows/native.yml').write_bytes(Path('docs/ui/.batch-native.txt').read_bytes())
          Path('docs/ui/.batch-native.txt').unlink()
          print('Completed feature wiring and restored normal verification configuration. No tests run.')
          PY
      - name: Install pinned Rust toolchain and compile prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update > /tmp/chat-batch-install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev >> /tmp/chat-batch-install.log 2>&1
      - name: Format and preserve the completed batch
        id: format
        run: |
          cargo +1.98.1 fmt -p synara-app -p synara-workspace
          python3 - <<'PY'
          from pathlib import Path
          for name in ['scripts/native_ui_scope.py', 'scripts/test_native_ui_scope.py', 'scripts/native_chat_tools_smoke.py']:
              compile(Path(name).read_text(), name, 'exec')
          PY
          git diff --check
          git add -u
          git diff --cached --stat
          git write-tree
          git diff --cached --binary > /tmp/chat-batch-source.patch
      - name: Retain review objects for plugin publication
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, subprocess, time, urllib.request, urllib.error
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          def api(path, payload):
              req = urllib.request.Request('https://api.github.com/repos/cmdr-chara/synara/git/' + path,
                  data=json.dumps(payload).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
                  time.sleep(0.5)
                  return result
              except urllib.error.HTTPError as error:
                  print('HANDOFF_ERROR', path, error.code, error.read().decode()[:1500])
                  raise
          head = git('rev-parse', 'HEAD')
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          entries = []
          for path in paths:
              file = pathlib.Path(path)
              print('SOURCE_PATH', path)
              if file.exists():
                  local_blob = git('hash-object', '--', path)
                  if path == '.github/workflows/native.yml':
                      assert local_blob == '2dcfb0993c6eef2a5e8b51623a898e426598dd47'
                      blob = local_blob
                  else:
                      blob = api('blobs', {'content': file.read_bytes().decode(), 'encoding': 'utf-8'})['sha']
                  assert blob == local_blob
                  mode = git('ls-files', '-s', '--', path).split()[0]
                  entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob})
                  print('RETAINED_BLOB', path, blob)
              else:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})['sha']
          assert tree == git('write-tree')
          commit = api('commits', {'message': 'feat(ui): complete batched conversation search, pins, export and draft utilities [skip ci]', 'tree': tree, 'parents': [head]})['sha']
          print('FINAL_SOURCE_TREE', tree)
          print('FINAL_SOURCE_COMMIT', commit)
          print('Review objects retained. Branch publication uses the GitHub plugin.')
          PY
      - name: Compile assembled batch once (tests deferred)
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: cargo +1.98.1 check --locked -p synara-app --bin synara-app
      - name: Assert no source mutation during compilation
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        with:
          name: chat-batch-source-patch
          path: /tmp/chat-batch-source.patch
          retention-days: 7
