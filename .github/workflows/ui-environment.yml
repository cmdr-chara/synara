name: Focused Environment workspace
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1000
          persist-credentials: false
      - name: Record candidate and verify scope selection
        id: scope
        env:
          BASE_REVISION: ${{ github.event.before }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        run: |
          mkdir -p /tmp/env-evidence /tmp/env-source
          git rev-parse HEAD | tee /tmp/env-evidence/revision.txt /tmp/env-source/revision.txt
          git bundle create /tmp/env-source/source.bundle HEAD
          python3 scripts/test_native_ui_scope.py
          python3 scripts/check_roadmap.py
          python3 -m py_compile scripts/native_environment_smoke.py scripts/native_git_review_smoke.py
          python3 - <<'PY'
          import os, re, subprocess, sys
          sys.path.insert(0, 'scripts')
          from native_ui_scope import terminal_probes_only, REVIEW_ANCHORS
          base, revision = os.environ['BASE_REVISION'], os.environ['CANDIDATE_REVISION']
          contract_only = False
          review_batch = True
          allowed = {'scripts/native_environment_smoke.py', 'scripts/native_ui_scope.py',
                     'scripts/test_native_ui_scope.py', '.github/workflows/ui-environment.yml'}
          if all(re.fullmatch('[a-f0-9]{40}', value) and value != '0' * 40 for value in (base, revision)):
              try:
                  paths = set(subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', '-z', base, revision, '--'], timeout=30).decode().rstrip('\0').split('\0'))
                  review_batch = bool(paths & REVIEW_ANCHORS) or '.github/workflows/ui-environment.yml' in paths
                  panels = 'crates/synara-app/src/shell/panels.rs'
                  if panels in paths and terminal_probes_only(subprocess.check_output(['git', 'diff', '--unified=0', base, revision, '--', panels], timeout=30).decode()):
                      paths.remove(panels)
                  contract_only = bool(paths) and paths <= allowed
              except (OSError, UnicodeError, subprocess.SubprocessError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'contract_only={str(contract_only).lower()}\n')
              output.write(f'review_batch={str(review_batch).lower()}\n')
          print(f'Only Environment test/probe changes: {contract_only}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-environment-source
          path: /tmp/env-source/
          retention-days: 7
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Native system libraries
        run: |
          sudo apt-get update > /tmp/env-evidence/install.log 2>&1
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev libssl-dev libclang-dev libzstd-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libwebkit2gtk-4.1-dev libgtk-3-dev xvfb mesa-vulkan-drivers libxtst6 python3-pil xclip fonts-dejavu-core fonts-liberation >> /tmp/env-evidence/install.log 2>&1
      - name: Focused regressions for production changes
        if: steps.scope.outputs.contract_only != 'true'
        run: |
          cargo +1.98.1 test --locked -p synara-workspace --lib environment::tests
          cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::environment::tests
          cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::drafts::tests
          cargo +1.98.1 test --locked -p synara-app --bin synara-app close::tests
          cargo +1.98.1 clippy --locked --no-deps -p synara-app -p synara-workspace --all-targets -- -D warnings
      - name: Focused Git review state, diff and persistence checks
        if: steps.scope.outputs.review_batch == 'true'
        run: |
          cargo +1.98.1 test --locked -p synara-workspace --lib storage::review::tests
          cargo +1.98.1 test --locked -p synara-app --bin synara-app shell::review::
      - name: Build native application and fixture
        id: build
        run: cargo +1.98.1 build --locked -p synara-app --bin synara-app -p synara-acp --bin synara-acp-fixture
      - name: Environment interaction and recovery
        timeout-minutes: 4
        run: python3 scripts/native_environment_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-workspace
      - name: Native Git review and draft recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.review_batch == 'true' }}
        timeout-minutes: 4
        run: python3 scripts/native_git_review_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-review
      - name: Existing chat and split behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.contract_only != 'true' }}
        timeout-minutes: 3
        run: python3 scripts/native_chat_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-chat
      - name: Existing chat and Studio restoration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.contract_only != 'true' }}
        timeout-minutes: 4
        run: python3 scripts/native_studio_settings_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-studio
      - name: Existing guarded close and permission boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.contract_only != 'true' }}
        timeout-minutes: 3
        run: python3 scripts/native_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-close
      - name: Existing board to chat navigation
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scope.outputs.contract_only != 'true' }}
        timeout-minutes: 4
        run: python3 scripts/native_kanban_smoke.py --binary target/debug/synara-app --fixture target/debug/synara-acp-fixture --output /tmp/env-kanban
      - name: Changed-package formatting
        run: cargo +1.98.1 fmt --check -p synara-app -p synara-workspace
      - name: Verify source identity
        run: |
          git diff --exit-code
          git ls-files -s > /tmp/env-evidence/blobs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: native-environment-workspace
          path: |
            /tmp/env-*/*.png
            /tmp/env-*/*.log
            /tmp/env-*/result.json
            /tmp/env-evidence/*.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Formatter diagnostics in a disposable copy only
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p /tmp/env-formatting
          git archive HEAD | tar -x -C /tmp/env-formatting
          (cd /tmp/env-formatting && cargo +1.98.1 fmt --all)
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ failure() && !cancelled() }}
        with:
          name: native-formatting-diagnostics
          path: /tmp/env-formatting/
          retention-days: 2
          if-no-files-found: ignore
